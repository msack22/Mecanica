
<div style="padding:8px 0">
<div style="display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap" id="niv-btns"></div>

<div id="niv-info" style="padding:12px 16px;background:var(--color-background-secondary);border-radius:8px;border:0.5px solid var(--color-border-info);margin-bottom:12px;min-height:80px">
  <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px" id="niv-title">Seleccioná un nivel</div>
  <div style="font-size:12px;color:var(--color-text-secondary)" id="niv-body">El motor tiene 4 niveles cuando lo mirás de frente. Cada nivel agrupa componentes relacionados.</div>
  <div style="font-size:11px;color:#BA7517;margin-top:6px" id="niv-tip"></div>
</div>

<svg width="100%" viewBox="0 0 680 520">
  <defs>
    <marker id="aniv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== NIVEL 4: TAPA (arriba del todo) ===== -->
  <g id="g-niv4">
    <!-- Tapa de válvulas -->
    <rect x="180" y="20" width="280" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="320" y="42" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Tapa de válvulas</text>
    <text x="320" y="58" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">cubre árbol de levas · tapón de carga aceite · dice "OIL"</text>
    <!-- Árbol de levas debajo de la tapa -->
    <rect x="190" y="72" width="260" height="18" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" opacity="0.6"/>
    <!-- Levas -->
    <ellipse cx="230" cy="72" rx="10" ry="14" fill="#BA7517" opacity="0.5"/>
    <ellipse cx="270" cy="72" rx="10" ry="14" fill="#BA7517" opacity="0.5"/>
    <ellipse cx="310" cy="72" rx="10" ry="14" fill="#BA7517" opacity="0.5"/>
    <ellipse cx="350" cy="72" rx="10" ry="14" fill="#BA7517" opacity="0.5"/>
    <ellipse cx="390" cy="72" rx="10" ry="14" fill="#BA7517" opacity="0.5"/>
    <ellipse cx="430" cy="72" rx="10" ry="14" fill="#BA7517" opacity="0.5"/>
    <ellipse cx="470" cy="72" rx="10" ry="14" fill="#BA7517" opacity="0.5"/>
    <ellipse cx="510" cy="72" rx="10" ry="14" fill="#BA7517" opacity="0.5"/>
    <text x="350" y="76" text-anchor="middle" font-size="8" fill="#BA7517" opacity="0.8">árbol de levas (adentro)</text>
    <!-- Bobina encima -->
    <rect x="340" y="22" width="110" height="30" rx="5" fill="#534AB7" opacity="0.8"/>
    <text x="395" y="41" text-anchor="middle" font-size="9" fill="#fff">Bobina + cables bujías</text>
    <!-- Label nivel -->
    <rect x="20" y="28" width="145" height="34" rx="6" fill="var(--color-background-secondary)" stroke="#BA7517" stroke-width="1"/>
    <text x="92" y="42" text-anchor="middle" font-size="11" font-weight="500" fill="#BA7517">Nivel 4</text>
    <text x="92" y="56" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">tapa + árbol levas</text>
  </g>

  <!-- ===== NIVEL 3: CULATA ===== -->
  <g id="g-niv3">
    <rect x="180" y="100" width="280" height="60" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="320" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Culata (cabeza)</text>
    <text x="320" y="138" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">válvulas · cámaras de combustión · conductos admisión/escape</text>
    <!-- Válvulas -->
    <rect x="198" y="108" width="10" height="44" rx="2" fill="#1D9E75" opacity="0.6"/>
    <rect x="218" y="108" width="10" height="44" rx="2" fill="#888780" opacity="0.6"/>
    <rect x="248" y="108" width="10" height="44" rx="2" fill="#1D9E75" opacity="0.6"/>
    <rect x="268" y="108" width="10" height="44" rx="2" fill="#888780" opacity="0.6"/>
    <rect x="298" y="108" width="10" height="44" rx="2" fill="#1D9E75" opacity="0.6"/>
    <rect x="318" y="108" width="10" height="44" rx="2" fill="#888780" opacity="0.6"/>
    <rect x="348" y="108" width="10" height="44" rx="2" fill="#1D9E75" opacity="0.6"/>
    <rect x="368" y="108" width="10" height="44" rx="2" fill="#888780" opacity="0.6"/>
    <!-- Inyectores -->
    <rect x="191" y="100" width="12" height="10" rx="2" fill="#BA7517" opacity="0.85"/>
    <rect x="241" y="100" width="12" height="10" rx="2" fill="#BA7517" opacity="0.85"/>
    <rect x="291" y="100" width="12" height="10" rx="2" fill="#BA7517" opacity="0.85"/>
    <rect x="341" y="100" width="12" height="10" rx="2" fill="#BA7517" opacity="0.85"/>
    <!-- Junta culata -->
    <rect x="180" y="160" width="280" height="8" rx="0" fill="var(--color-text-secondary)" opacity="0.3"/>
    <text x="500" y="167" font-size="9" fill="var(--color-text-tertiary)">← junta de culata</text>
    <!-- Label -->
    <rect x="20" y="108" width="145" height="44" rx="6" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1"/>
    <text x="92" y="124" text-anchor="middle" font-size="11" font-weight="500" fill="#1D9E75">Nivel 3</text>
    <text x="92" y="139" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">culata + válvulas</text>
    <text x="92" y="151" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">+ inyectores</text>
  </g>

  <!-- ===== NIVEL 2: BLOQUE ===== -->
  <g id="g-niv2">
    <rect x="180" y="168" width="280" height="130" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="320" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Bloque del motor</text>
    <!-- 4 cilindros -->
    <rect x="192" y="200" width="52" height="88" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <rect x="252" y="200" width="52" height="88" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <rect x="312" y="200" width="52" height="88" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <rect x="372" y="200" width="52" height="88" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <!-- Pistones -->
    <rect x="196" y="248" width="44" height="14" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
    <rect x="256" y="232" width="44" height="14" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
    <rect x="316" y="248" width="44" height="14" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
    <rect x="376" y="232" width="44" height="14" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
    <!-- Bielas -->
    <line x1="218" y1="262" x2="218" y2="285" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="278" y1="246" x2="278" y2="285" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="338" y1="262" x2="338" y2="285" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="398" y1="246" x2="398" y2="285" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- Cigüeñal -->
    <rect x="185" y="285" width="272" height="10" rx="5" fill="var(--color-text-secondary)" opacity="0.35"/>
    <text x="320" y="293" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">cigüeñal</text>
    <!-- Label -->
    <rect x="20" y="180" width="145" height="110" rx="6" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <text x="92" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="#534AB7">Nivel 2</text>
    <text x="92" y="218" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">bloque · cilindros</text>
    <text x="92" y="233" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">pistones · bielas</text>
    <text x="92" y="248" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">cigüeñal</text>
    <text x="92" y="263" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">canales aceite/agua</text>
    <text x="92" y="278" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">(todo interno)</text>
  </g>

  <!-- ===== NIVEL 1: BASE ===== -->
  <g id="g-niv1">
    <!-- Cárter -->
    <rect x="180" y="298" width="280" height="50" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="320" y="320" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Cárter de aceite</text>
    <text x="320" y="336" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">depósito aceite · tapón drenaje · bomba aceite adentro</text>
    <!-- Aceite -->
    <rect x="183" y="318" width="274" height="27" rx="0" fill="#BA7517" opacity="0.12"/>
    <!-- Label -->
    <rect x="20" y="306" width="145" height="34" rx="6" fill="var(--color-background-secondary)" stroke="#854F0B" stroke-width="1"/>
    <text x="92" y="320" text-anchor="middle" font-size="11" font-weight="500" fill="#854F0B">Nivel 1</text>
    <text x="92" y="334" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">cárter + aceite</text>
  </g>

  <!-- ===== LATERAL: CORREAS Y ACCESORIOS ===== -->
  <g id="g-correas">
    <!-- Polea cigüeñal -->
    <circle cx="590" cy="310" r="32" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="590" y="307" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">Polea</text>
    <text x="590" y="320" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">cigüeñal</text>
    <!-- Polea distribución -->
    <circle cx="590" cy="110" r="24" fill="var(--color-background-secondary)" stroke="#BA7517" stroke-width="1.5"/>
    <text x="590" y="107" text-anchor="middle" font-size="8" fill="#BA7517">Polea</text>
    <text x="590" y="119" text-anchor="middle" font-size="8" fill="#BA7517">dist.</text>
    <!-- Correa distribución -->
    <rect x="572" y="134" width="36" height="176" rx="0" fill="none" stroke="#534AB7" stroke-width="6" opacity="0.35"/>
    <text x="552" y="225" text-anchor="end" font-size="9" fill="#534AB7">correa dist.</text>
    <!-- Tensador distribución -->
    <circle cx="614" cy="215" r="14" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="614" y="212" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">tens.</text>
    <text x="614" y="222" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">dist.</text>
    <!-- Bomba agua en la correa -->
    <rect x="558" y="178" width="26" height="26" rx="5" fill="var(--color-background-secondary)" stroke="#185FA5" stroke-width="1"/>
    <text x="571" y="192" text-anchor="middle" font-size="7" fill="#185FA5">B.H₂O</text>
    <!-- Polea alternador -->
    <circle cx="590" cy="400" r="20" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="590" y="397" text-anchor="middle" font-size="8" fill="#1D9E75">Alter-</text>
    <text x="590" y="408" text-anchor="middle" font-size="8" fill="#1D9E75">nador</text>
    <!-- Correa auxiliar/accesorios -->
    <rect x="572" y="342" width="36" height="58" rx="0" fill="none" stroke="#1D9E75" stroke-width="4" opacity="0.4"/>
    <text x="552" y="380" text-anchor="end" font-size="9" fill="#1D9E75">correa aux.</text>
    <!-- Tensador auxiliar -->
    <circle cx="614" cy="370" r="12" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="614" y="367" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">tens.</text>
    <text x="614" y="377" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">aux.</text>
    <!-- Polea dirección hidráulica -->
    <circle cx="650" cy="310" r="16" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="650" y="307" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">Dir.</text>
    <text x="650" y="318" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">hid.</text>
    <!-- Label lateral -->
    <text x="590" y="470" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)">vista lateral</text>
    <text x="590" y="483" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)">(lado correas)</text>
  </g>

  <!-- HIGHLIGHTS (ocultos) -->
  <rect id="hl-niv4" x="178" y="18" width="284" height="86" rx="10" fill="none" stroke="#BA7517" stroke-width="2.5" opacity="0"/>
  <rect id="hl-niv3" x="178" y="98" width="284" height="72" rx="10" fill="none" stroke="#1D9E75" stroke-width="2.5" opacity="0"/>
  <rect id="hl-niv2" x="178" y="166" width="284" height="144" rx="10" fill="none" stroke="#534AB7" stroke-width="2.5" opacity="0"/>
  <rect id="hl-niv1" x="178" y="296" width="284" height="56" rx="10" fill="none" stroke="#854F0B" stroke-width="2.5" opacity="0"/>
  <rect id="hl-correas" x="540" y="90" width="140" height="410" rx="10" fill="none" stroke="#E24B4A" stroke-width="2.5" opacity="0"/>
</svg>
</div>

<script>
(function(){
  var niveles = [
    {
      label: 'Nivel 4 — Tapa',
      hl: 'hl-niv4',
      title: 'Nivel 4 — Tapa de válvulas (lo más visible desde arriba)',
      body: 'Es la tapa de plástico o metal que ves al abrir el capó. Adentro está el árbol de levas. Encima o a un lado tiene el tapón de carga de aceite (dice OIL). La bobina está atornillada sobre esta tapa con los 4 cables de bujías saliendo hacia abajo. Para acceder al árbol de levas hay que sacar esta tapa.',
      tip: 'Esto es lo primero que ves al abrir el capó — es la "cara" del motor.'
    },
    {
      label: 'Nivel 3 — Culata',
      hl: 'hl-niv3',
      title: 'Nivel 3 — Culata (cabeza del motor)',
      body: 'Debajo de la tapa de válvulas. Contiene las válvulas de admisión y escape, las cámaras de combustión y los conductos por donde entran aire/nafta y salen gases. Los inyectores están atornillados acá. La separa del bloque la junta de culata — si se rompe, el aceite y el agua se mezclan.',
      tip: '⚠ La junta de culata quemada es una de las fallas más caras — se detecta por el aceite lechoso o humo blanco.'
    },
    {
      label: 'Nivel 2 — Bloque',
      hl: 'hl-niv2',
      title: 'Nivel 2 — Bloque (el corazón)',
      body: 'La pieza más grande y pesada. Adentro están los 4 cilindros con sus pistones, bielas y el cigüeñal en la base. También tiene los canales internos por donde circula el aceite y el líquido refrigerante. La bomba de aceite está pegada al frente del bloque. No se puede ver desde afuera — es todo interno.',
      tip: 'El bloque es de hierro fundido en el AP y de aluminio en el EA111 del Trend — más liviano pero más sensible al recalentamiento.'
    },
    {
      label: 'Nivel 1 — Cárter',
      hl: 'hl-niv1',
      title: 'Nivel 1 — Cárter (la base)',
      body: 'La pieza más baja del motor, lo primero que ves desde abajo. Es el depósito de aceite — el aceite vive acá cuando el motor está apagado. Tiene un tapón de drenaje para hacer el cambio de aceite. La bomba de aceite está adentro del bloque justo encima del cárter y succiona desde acá.',
      tip: 'Si golpeás el cárter contra algo (como un badén alto) podés romperlo y perder todo el aceite — motor fundido en minutos.'
    },
    {
      label: 'Correas y poleas',
      hl: 'hl-correas',
      title: 'Sistema de correas — lateral del motor',
      body: 'En el lateral del motor hay DOS sistemas de correas. La correa de distribución (azul) une la polea del cigüeñal con la del árbol de levas, pasando por la bomba de agua y el tensador. La correa auxiliar (verde) mueve el alternador y la dirección hidráulica. Cada una tiene su tensador para mantener la tensión correcta.',
      tip: '⚠ Dos correas, dos tensadores, dos sistemas. Siempre se cambian juntas con sus tensadores — nunca solo la correa.'
    },
    {
      label: 'Todo junto',
      hl: null,
      title: 'El motor completo — de arriba a abajo',
      body: 'Nivel 4 (tapa) → Nivel 3 (culata con válvulas e inyectores) → Nivel 2 (bloque con pistones, bielas y cigüeñal) → Nivel 1 (cárter con aceite). En el lateral: dos sistemas de correas. Todo conectado, todo sincronizado. Cada nivel tiene un propósito y una forma de acceder a él.',
      tip: 'Para desarmar el motor vas de arriba hacia abajo: tapa → culata → bloque → cárter. Para armar, al revés.'
    }
  ];

  function op(id, val) { var e = document.getElementById(id); if(e) e.setAttribute('opacity', val); }
  var allHl = ['hl-niv4','hl-niv3','hl-niv2','hl-niv1','hl-correas'];

  var btnRow = document.getElementById('niv-btns');
  niveles.forEach(function(n) {
    var b = document.createElement('button');
    b.textContent = n.label;
    b.style.cssText = 'cursor:pointer;padding:6px 10px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);';
    b.addEventListener('click', function() {
      btnRow.querySelectorAll('button').forEach(function(btn) {
        btn.style.background = 'var(--color-background-secondary)';
        btn.style.color = 'var(--color-text-secondary)';
        btn.style.borderColor = 'var(--color-border-secondary)';
        btn.style.fontWeight = '400';
      });
      b.style.background = 'var(--color-background-info)';
      b.style.color = 'var(--color-text-info)';
      b.style.borderColor = 'var(--color-border-info)';
      b.style.fontWeight = '500';

      document.getElementById('niv-title').textContent = n.title;
      document.getElementById('niv-body').textContent = n.body;
      document.getElementById('niv-tip').textContent = n.tip;

      allHl.forEach(function(id){ op(id, 0); });
      if(n.hl) op(n.hl, 1);
    });
    btnRow.appendChild(b);
  });

  btnRow.querySelectorAll('button')[0].click();
})();
</script>
