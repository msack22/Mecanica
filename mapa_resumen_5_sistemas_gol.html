
<div style="padding:8px 0">
<div style="display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
  <button onclick="showSis('todos')" id="s-todos" style="cursor:pointer;padding:5px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info);font-weight:500">Todos</button>
  <button onclick="showSis('mecanico')" id="s-mecanico" style="cursor:pointer;padding:5px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">🔧 Mecánico</button>
  <button onclick="showSis('combustible')" id="s-combustible" style="cursor:pointer;padding:5px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">⛽ Combustible</button>
  <button onclick="showSis('refrigeracion')" id="s-refrigeracion" style="cursor:pointer;padding:5px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">💧 Refrigeración</button>
  <button onclick="showSis('lubricacion')" id="s-lubricacion" style="cursor:pointer;padding:5px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">🛢 Lubricación</button>
  <button onclick="showSis('electrico')" id="s-electrico" style="cursor:pointer;padding:5px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">⚡ Eléctrico</button>
</div>

<svg width="100%" viewBox="0 0 680 460">
  <defs>
    <marker id="ams" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ======= BLOQUE MOTOR CENTRAL ======= -->
  <rect x="240" y="160" width="200" height="130" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <text x="340" y="222" text-anchor="middle" font-size="13" font-weight="500" fill="var(--color-text-primary)">Motor</text>
  <text x="340" y="240" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">bloque + cabeza</text>

  <!-- ======= SISTEMA MECÁNICO ======= -->
  <!-- Pistones dentro del bloque -->
  <g id="g-mec">
    <rect x="258" y="195" width="36" height="50" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" opacity="0.8"/>
    <rect x="302" y="195" width="36" height="50" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" opacity="0.8"/>
    <rect x="346" y="195" width="36" height="50" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" opacity="0.8"/>
    <rect x="390" y="195" width="36" height="50" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" opacity="0.8"/>
    <text x="276" y="225" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">C1</text>
    <text x="320" y="225" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">C2</text>
    <text x="364" y="225" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">C3</text>
    <text x="408" y="225" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">C4</text>
    <!-- cigüeñal -->
    <rect x="248" y="270" width="184" height="12" rx="6" fill="var(--color-text-secondary)" opacity="0.2"/>
    <text x="340" y="279" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">cigüeñal</text>
    <!-- label sistema -->
    <rect x="240" y="118" width="200" height="36" rx="8" fill="var(--color-background-secondary)" stroke="#0F6E56" stroke-width="1"/>
    <text x="340" y="141" text-anchor="middle" font-size="12" font-weight="500" fill="#0F6E56">🔧 Mecánico</text>
    <line x1="340" y1="154" x2="340" y2="160" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  </g>

  <!-- ======= SISTEMA COMBUSTIBLE ======= -->
  <g id="g-comb">
    <!-- Inyectores sobre el bloque -->
    <rect x="258" y="168" width="14" height="10" rx="2" fill="#BA7517" opacity="0.85"/>
    <rect x="302" y="168" width="14" height="10" rx="2" fill="#BA7517" opacity="0.85"/>
    <rect x="346" y="168" width="14" height="10" rx="2" fill="#BA7517" opacity="0.85"/>
    <rect x="390" y="168" width="14" height="10" rx="2" fill="#BA7517" opacity="0.85"/>
    <!-- Tanque combustible -->
    <rect x="500" y="320" width="130" height="50" rx="8" fill="var(--color-background-secondary)" stroke="#BA7517" stroke-width="1"/>
    <text x="565" y="342" text-anchor="middle" font-size="11" font-weight="500" fill="#BA7517">Tanque</text>
    <text x="565" y="358" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">bomba de nafta adentro</text>
    <!-- Línea tanque → inyectores -->
    <path d="M 500 340 L 440 340 L 440 173 L 404 173" fill="none" stroke="#BA7517" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ams)" opacity="0.7"/>
    <!-- ECU controla -->
    <text x="470" y="255" text-anchor="middle" font-size="9" fill="#BA7517" opacity="0.8">nafta</text>
    <!-- label -->
    <rect x="500" y="270" width="130" height="36" rx="8" fill="var(--color-background-secondary)" stroke="#BA7517" stroke-width="1"/>
    <text x="565" y="293" text-anchor="middle" font-size="12" font-weight="500" fill="#BA7517">⛽ Combustible</text>
  </g>

  <!-- ======= SISTEMA REFRIGERACIÓN ======= -->
  <g id="g-ref">
    <!-- Radiador -->
    <rect x="240" y="30" width="200" height="50" rx="8" fill="var(--color-background-secondary)" stroke="#185FA5" stroke-width="1"/>
    <text x="340" y="52" text-anchor="middle" font-size="11" font-weight="500" fill="#185FA5">Radiador</text>
    <text x="340" y="68" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">+ ventilador + depósito</text>
    <!-- Manguera caliente motor → radiador -->
    <path d="M 340 160 L 340 80" fill="none" stroke="#E24B4A" stroke-width="3" stroke-linecap="round" marker-end="url(#ams)" opacity="0.6"/>
    <text x="350" y="125" font-size="9" fill="#E24B4A" opacity="0.8">caliente</text>
    <!-- Manguera fría radiador → motor -->
    <path d="M 310 80 L 310 160" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round" marker-end="url(#ams)" opacity="0.6"/>
    <text x="272" y="125" font-size="9" fill="#185FA5" opacity="0.8">frío</text>
    <!-- Termostato y bomba -->
    <rect x="100" y="175" width="110" height="36" rx="8" fill="var(--color-background-secondary)" stroke="#185FA5" stroke-width="1"/>
    <text x="155" y="191" text-anchor="middle" font-size="10" font-weight="500" fill="#185FA5">Termostato</text>
    <text x="155" y="204" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">dentro del bloque</text>
    <rect x="100" y="230" width="110" height="36" rx="8" fill="var(--color-background-secondary)" stroke="#185FA5" stroke-width="1"/>
    <text x="155" y="246" text-anchor="middle" font-size="10" font-weight="500" fill="#185FA5">Bomba de agua</text>
    <text x="155" y="259" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">lateral del motor</text>
    <line x1="210" y1="193" x2="240" y2="210" stroke="#185FA5" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
    <line x1="210" y1="248" x2="240" y2="255" stroke="#185FA5" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
    <!-- label -->
    <rect x="80" y="118" width="150" height="36" rx="8" fill="var(--color-background-secondary)" stroke="#185FA5" stroke-width="1"/>
    <text x="155" y="141" text-anchor="middle" font-size="12" font-weight="500" fill="#185FA5">💧 Refrigeración</text>
  </g>

  <!-- ======= SISTEMA LUBRICACIÓN ======= -->
  <g id="g-lub">
    <!-- Cárter -->
    <rect x="240" y="370" width="200" height="46" rx="8" fill="var(--color-background-secondary)" stroke="#854F0B" stroke-width="1"/>
    <rect x="243" y="388" width="194" height="25" rx="0" fill="#BA7517" opacity="0.15"/>
    <text x="340" y="390" text-anchor="middle" font-size="11" font-weight="500" fill="#854F0B">Cárter (aceite)</text>
    <text x="340" y="406" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">base del motor</text>
    <!-- Filtro aceite -->
    <rect x="100" y="310" width="110" height="36" rx="8" fill="var(--color-background-secondary)" stroke="#854F0B" stroke-width="1"/>
    <text x="155" y="326" text-anchor="middle" font-size="10" font-weight="500" fill="#854F0B">Filtro aceite</text>
    <text x="155" y="339" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">lateral exterior</text>
    <!-- flecha aceite sube -->
    <path d="M 240 390 L 155 390 L 155 346" fill="none" stroke="#854F0B" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ams)" opacity="0.7"/>
    <path d="M 210 328 L 240 270" fill="none" stroke="#854F0B" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ams)" opacity="0.5"/>
    <!-- label -->
    <rect x="80" y="370" width="130" height="36" rx="8" fill="var(--color-background-secondary)" stroke="#854F0B" stroke-width="1"/>
    <text x="145" y="393" text-anchor="middle" font-size="12" font-weight="500" fill="#854F0B">🛢 Lubricación</text>
  </g>

  <!-- ======= SISTEMA ELÉCTRICO ======= -->
  <g id="g-ele">
    <!-- Batería -->
    <rect x="500" y="30" width="130" height="50" rx="8" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <text x="565" y="52" text-anchor="middle" font-size="11" font-weight="500" fill="#534AB7">Batería 12V</text>
    <text x="565" y="68" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">adelante izquierda</text>
    <!-- Bobina + cables -->
    <rect x="500" y="110" width="130" height="50" rx="8" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <text x="565" y="132" text-anchor="middle" font-size="11" font-weight="500" fill="#534AB7">Bobina</text>
    <text x="565" y="148" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">+ 4 cables a bujías</text>
    <!-- Alternador -->
    <rect x="500" y="190" width="130" height="50" rx="8" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <text x="565" y="212" text-anchor="middle" font-size="11" font-weight="500" fill="#534AB7">Alternador</text>
    <text x="565" y="228" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">recarga la batería</text>
    <!-- Burro -->
    <rect x="500" y="260" width="130" height="44" rx="8" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <text x="565" y="279" text-anchor="middle" font-size="11" font-weight="500" fill="#534AB7">Burro arranque</text>
    <text x="565" y="294" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">trasero inferior</text>
    <!-- flechas eléctricas -->
    <line x1="500" y1="55" x2="460" y2="168" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ams)" opacity="0.5"/>
    <line x1="500" y1="215" x2="440" y2="215" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ams)" opacity="0.5"/>
    <!-- label -->
    <rect x="500" y="370" width="130" height="36" rx="8" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <text x="565" y="393" text-anchor="middle" font-size="12" font-weight="500" fill="#534AB7">⚡ Eléctrico</text>
  </g>

  <!-- ======= OVERLAYS para filtrar ======= -->
  <rect id="dim-mec" x="0" y="0" width="680" height="460" fill="var(--color-background-primary)" opacity="0"/>
  <rect id="dim-comb" x="0" y="0" width="680" height="460" fill="var(--color-background-primary)" opacity="0"/>
  <rect id="dim-ref" x="0" y="0" width="680" height="460" fill="var(--color-background-primary)" opacity="0"/>
  <rect id="dim-lub" x="0" y="0" width="680" height="460" fill="var(--color-background-primary)" opacity="0"/>
  <rect id="dim-ele" x="0" y="0" width="680" height="460" fill="var(--color-background-primary)" opacity="0"/>
</svg>

<!-- Info card -->
<div id="info-card" style="margin:8px 0 0;padding:12px 16px;background:var(--color-background-secondary);border-radius:8px;border:0.5px solid var(--color-border-tertiary);font-size:12px;color:var(--color-text-secondary);min-height:48px">
  <span id="info-card-text">Todos los sistemas trabajando al mismo tiempo — cada uno cumple su rol mientras el motor está en marcha.</span>
</div>
</div>

<script>
(function(){
  var infos = {
    todos: "Todos los sistemas trabajando al mismo tiempo — cada uno cumple su rol mientras el motor está en marcha.",
    mecanico: "🔧 Mecánico: los 4 cilindros con sus pistones, bielas y el cigüeñal. Convierten las explosiones en rotación. Todo lo demás existe para que ESTO funcione bien.",
    combustible: "⛽ Combustible: la nafta viaja desde el tanque, pasa por la bomba de nafta, llega a los 4 inyectores. La ECU decide cuánto y cuándo inyectar.",
    refrigeracion: "💧 Refrigeración: el líquido circula entre el motor y el radiador. El termostato controla cuándo circular, la bomba de agua lo mueve, el ventilador ayuda a enfriar el radiador.",
    lubricacion: "🛢 Lubricación: el aceite vive en el cárter. La bomba lo sube por canales internos hasta lubricar pistones, bielas, cigüeñal y válvulas. El filtro atrapa las impurezas.",
    electrico: "⚡ Eléctrico: la batería arranca todo. El alternador recarga la batería mientras el motor corre. La bobina genera la chispa. La ECU coordina inyectores, bobina y sensores."
  };

  function setBtn(id) {
    ['todos','mecanico','combustible','refrigeracion','lubricacion','electrico'].forEach(function(k){
      var b = document.getElementById('s-'+k);
      if(!b) return;
      if(k===id){
        b.style.background='var(--color-background-info)'; b.style.color='var(--color-text-info)';
        b.style.borderColor='var(--color-border-info)'; b.style.fontWeight='500';
      } else {
        b.style.background='var(--color-background-secondary)'; b.style.color='var(--color-text-secondary)';
        b.style.borderColor='var(--color-border-secondary)'; b.style.fontWeight='400';
      }
    });
  }

  function op(id,val){ var e=document.getElementById(id); if(e) e.setAttribute('opacity',val); }

  window.showSis = function(tab) {
    setBtn(tab);
    document.getElementById('info-card-text').textContent = infos[tab];

    // reset todos visibles
    ['g-mec','g-comb','g-ref','g-lub','g-ele'].forEach(function(id){ op(id,1); });

    if(tab==='todos') return;

    var map = {
      mecanico: 'g-mec',
      combustible: 'g-comb',
      refrigeracion: 'g-ref',
      lubricacion: 'g-lub',
      electrico: 'g-ele'
    };

    // atenuar los que no son el seleccionado
    Object.keys(map).forEach(function(k){
      if(k !== tab) op(map[k], 0.08);
    });
  };

  window.showSis('todos');
})();
</script>
