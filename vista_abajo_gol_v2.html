
<div style="padding:8px 0">

<!-- Botones de componentes -->
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px" id="ab-btns"></div>

<!-- Info card -->
<div id="ab-info" style="padding:12px 16px;background:var(--color-background-secondary);border-radius:8px;border:0.5px solid var(--color-border-info);font-size:12px;margin-bottom:12px;min-height:52px">
  <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px" id="ab-info-title">Seleccioná un componente</div>
  <div style="color:var(--color-text-secondary)" id="ab-info-body">Tocá cualquier botón para ver dónde está y qué hace en el Gol.</div>
</div>

<!-- SVG vista desde abajo -->
<svg width="100%" viewBox="0 0 680 460">

  <!-- Contorno auto -->
  <rect x="70" y="10" width="540" height="440" rx="30" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.35"/>

  <!-- Labels dirección -->
  <text x="340" y="8" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">▲ FRENTE</text>
  <text x="340" y="458" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">▼ ATRÁS</text>

  <!-- Ruedas -->
  <rect x="72" y="18" width="55" height="110" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.5"/>
  <rect x="553" y="18" width="55" height="110" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.5"/>
  <rect x="72" y="332" width="55" height="110" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.5"/>
  <rect x="553" y="332" width="55" height="110" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.5"/>
  <text x="99" y="78" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">🛞</text>
  <text x="580" y="78" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">🛞</text>
  <text x="99" y="392" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">🛞</text>
  <text x="580" y="392" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">🛞</text>

  <!-- ===== COMPONENTES ===== -->

  <!-- Motor -->
  <rect id="r-motor" x="185" y="25" width="155" height="95" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="262" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Motor</text>
  <text x="262" y="84" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">bloque + cárter</text>

  <!-- Cárter (parte baja del motor) -->
  <rect id="r-carter" x="205" y="130" width="115" height="42" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="262" y="148" text-anchor="middle" font-size="10" font-weight="500" fill="var(--color-text-primary)">Cárter</text>
  <text x="262" y="162" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">tapón de drenaje</text>

  <!-- Caja de cambios -->
  <rect id="r-caja" x="340" y="25" width="115" height="95" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="397" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Caja de</text>
  <text x="397" y="80" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">cambios</text>
  <text x="397" y="97" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">+ diferencial</text>

  <!-- Semiejes -->
  <rect id="r-semi-iz" x="127" y="62" width="58" height="12" rx="4" fill="#BA7517" opacity="0.7"/>
  <rect id="r-semi-de" x="455" y="62" width="98" height="12" rx="4" fill="#BA7517" opacity="0.7"/>
  <text x="155" y="55" text-anchor="middle" font-size="8" fill="#BA7517">semieje izq.</text>
  <text x="504" y="55" text-anchor="middle" font-size="8" fill="#BA7517">semieje der.</text>

  <!-- Dirección -->
  <rect id="r-dir" x="150" y="182" width="340" height="22" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="320" y="197" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">barra de dirección</text>

  <!-- Amortiguadores -->
  <circle id="r-amort" cx="140" cy="50" r="16" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="140" y="47" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">amort</text>
  <text x="140" y="57" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">del.</text>
  <circle cx="540" cy="50" r="16" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="540" y="47" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">amort</text>
  <text x="540" y="57" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">del.</text>
  <circle cx="140" cy="390" r="16" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="140" y="387" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">amort</text>
  <text x="140" y="397" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">tras.</text>
  <circle cx="540" cy="390" r="16" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="540" y="387" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">amort</text>
  <text x="540" y="397" text-anchor="middle" font-size="7" fill="var(--color-text-secondary)">tras.</text>

  <!-- Escape: tubo central -->
  <rect id="r-escape" x="375" y="130" width="30" height="200" rx="4" fill="#888780" opacity="0.25"/>
  <rect x="360" y="130" width="60" height="30" rx="5" fill="var(--color-background-secondary)" stroke="#888780" stroke-width="0.5"/>
  <text x="390" y="150" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">manifold</text>
  <rect x="365" y="200" width="50" height="28" rx="5" fill="var(--color-background-secondary)" stroke="#888780" stroke-width="0.5"/>
  <text x="390" y="218" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">catalizador</text>
  <rect x="360" y="300" width="60" height="24" rx="5" fill="var(--color-background-secondary)" stroke="#888780" stroke-width="0.5"/>
  <text x="390" y="316" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">silenciador</text>
  <text x="440" y="235" font-size="10" fill="#888780">escape →</text>

  <!-- Tanque nafta -->
  <rect id="r-tanque" x="180" y="330" width="180" height="80" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="270" y="368" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Tanque</text>
  <text x="270" y="384" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">bajo asiento trasero</text>

  <!-- Frenos -->
  <rect id="r-frenos" x="127" y="25" width="56" height="38" rx="5" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="155" y="40" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">freno</text>
  <text x="155" y="52" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">disco del.</text>
  <rect x="457" y="25" width="96" height="38" rx="5" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="505" y="40" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">freno</text>
  <text x="505" y="52" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">disco del.</text>
  <rect x="127" y="345" width="50" height="38" rx="5" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="152" y="367" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">tambor</text>
  <text x="152" y="378" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">tras.</text>
  <rect x="503" y="345" width="50" height="38" rx="5" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="528" y="367" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">tambor</text>
  <text x="528" y="378" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">tras.</text>

  <!-- HIGHLIGHT (siempre transparente, se activa por JS) -->
  <rect id="hl-box" x="0" y="0" width="0" height="0" rx="8" fill="none" stroke="var(--color-border-info)" stroke-width="3" opacity="0"/>
</svg>
</div>

<script>
(function(){
  var partes = [
    { id:'motor',    label:'Motor',         color:'#185FA5',
      rect:[185,25,155,95],
      title:'Motor y cárter',
      body:'Adelante izquierdo. Lo primero que ves al mirar desde abajo es el cárter (base del motor). El tapón de drenaje del aceite está en la parte más baja del cárter.' },
    { id:'caja',     label:'Caja / diferencial', color:'#534AB7',
      rect:[340,25,115,95],
      title:'Caja de cambios + diferencial',
      body:'Pegada al costado del motor. El diferencial está adentro. De acá salen los dos semiejes hacia las ruedas delanteras. Se ve claramente desde abajo.' },
    { id:'semiejes', label:'Semiejes',       color:'#BA7517',
      rect:[127,55,426,22],
      title:'Semiejes',
      body:'Dos barras que salen de la caja hacia cada rueda delantera. En los extremos tienen juntas homocinéticas (tipo bola) que permiten que la rueda gire y se mueva con la suspensión.' },
    { id:'direccion',label:'Dirección',      color:'#0F6E56',
      rect:[150,182,340,22],
      title:'Barra de dirección',
      body:'Cruza de rueda a rueda en el eje delantero. El volante mueve esta barra que a su vez gira las ruedas. En el Gol es dirección asistida hidráulica.' },
    { id:'escape',   label:'Escape',         color:'#5F5E5A',
      rect:[360,130,60,200],
      title:'Sistema de escape',
      body:'Sale del motor, baja, pasa por el catalizador (reduce contaminantes), sigue por el tubo central, pasa por el silenciador y termina en el caño de escape atrás del auto.' },
    { id:'tanque',   label:'Tanque nafta',   color:'#854F0B',
      rect:[180,330,180,80],
      title:'Tanque de nafta',
      body:'Está debajo de los asientos traseros, bien protegido. La bomba de nafta está adentro del tanque. En el Gol tiene aprox. 40-50 litros de capacidad.' },
    { id:'frenos',   label:'Frenos',         color:'#A32D2D',
      rect:[127,25,56,38],
      title:'Frenos del Gol',
      body:'Delanteros: discos con pinzas y pastillas — se ven claramente. Traseros: tambores (en la mayoría de los Gol). Los tambores son cilindros donde van las zapatas adentro.' },
    { id:'amort',    label:'Amortiguadores', color:'#3B6D11',
      rect:[124,34,32,32],
      title:'Amortiguadores (4)',
      body:'Uno por rueda. Los delanteros son tipo telescópico integrados al portamazas. Los traseros son más simples. Desde abajo se ven los brazos de suspensión que los conectan.' },
  ];

  var btnRow = document.getElementById('ab-btns');
  var selected = null;

  partes.forEach(function(p) {
    var b = document.createElement('button');
    b.textContent = p.label;
    b.style.cssText = 'cursor:pointer;padding:6px 8px;font-size:11px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);text-align:center;';
    b.addEventListener('click', function() {
      // reset botones
      btnRow.querySelectorAll('button').forEach(function(btn) {
        btn.style.background = 'var(--color-background-secondary)';
        btn.style.color = 'var(--color-text-secondary)';
        btn.style.borderColor = 'var(--color-border-secondary)';
        btn.style.fontWeight = '400';
      });
      b.style.background = 'var(--color-background-info)';
      b.style.color = 'var(--color-text-info)';
      b.style.borderColor = 'var(--color-border-info)';
      b.style.fontWeight = '500';

      // info card
      document.getElementById('ab-info-title').textContent = p.title;
      document.getElementById('ab-info-body').textContent = p.body;

      // highlight en SVG
      var hl = document.getElementById('hl-box');
      hl.setAttribute('x', p.rect[0]-4);
      hl.setAttribute('y', p.rect[1]-4);
      hl.setAttribute('width', p.rect[2]+8);
      hl.setAttribute('height', p.rect[3]+8);
      hl.setAttribute('stroke', p.color);
      hl.setAttribute('opacity', '1');
    });
    btnRow.appendChild(b);
  });
})();
</script>
