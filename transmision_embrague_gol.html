
<div style="padding:8px 0">
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
  <button onclick="showEmb('soltado')" id="e-soltado" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info);font-weight:500">Embrague soltado (normal)</button>
  <button onclick="showEmb('pisado')" id="e-pisado" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Embrague pisado</button>
  <button onclick="showEmb('camino')" id="e-camino" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Camino a las ruedas</button>
</div>

<svg width="100%" viewBox="0 0 680 420">
  <defs>
    <marker id="atr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INFO BOX -->
  <rect x="20" y="30" width="190" height="280" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text id="t-title" x="115" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-text-primary)">Embrague soltado</text>
  <text id="t-1" x="115" y="82"  text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">El disco de embrague</text>
  <text id="t-2" x="115" y="100" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">está apretado entre</text>
  <text id="t-3" x="115" y="118" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">el volante motor y</text>
  <text id="t-4" x="115" y="136" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">el plato de presión.</text>
  <text id="t-5" x="115" y="164" text-anchor="middle" font-size="12" fill="#1D9E75">La fuerza del motor</text>
  <text id="t-6" x="115" y="182" text-anchor="middle" font-size="12" fill="#1D9E75">llega a la caja.</text>
  <text id="t-7" x="115" y="210" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Es el estado normal</text>
  <text id="t-8" x="115" y="228" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">mientras manejás.</text>
  <text id="t-tip" x="115" y="270" text-anchor="middle" font-size="11" fill="#BA7517"></text>
  <text id="t-tip2" x="115" y="286" text-anchor="middle" font-size="11" fill="#BA7517"></text>

  <!-- ===== MOTOR ===== -->
  <rect x="230" y="60" width="100" height="80" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="280" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-primary)">Motor</text>
  <text x="280" y="114" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">cigüeñal gira</text>

  <!-- Volante motor (unido al cigüeñal) -->
  <circle cx="280" cy="175" r="28" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <text x="280" y="172" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">volante</text>
  <text x="280" y="184" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">motor</text>
  <!-- Eje cigüeñal → volante -->
  <line x1="280" y1="140" x2="280" y2="147" stroke="var(--color-text-secondary)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- DISCO DE EMBRAGUE -->
  <g id="g-disco">
    <ellipse id="disco-shape" cx="350" cy="175" rx="10" ry="28" fill="#534AB7" opacity="0.7"/>
    <text id="disco-lbl" x="350" y="220" text-anchor="middle" font-size="9" fill="#534AB7">disco</text>
  </g>

  <!-- PLATO DE PRESIÓN -->
  <rect id="plato" x="368" y="147" width="22" height="56" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
  <text x="379" y="225" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">plato</text>

  <!-- SEPARACIÓN (cuando pisado) -->
  <line id="sep-emb" x1="342" y1="147" x2="342" y2="203" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4 3" opacity="0"/>

  <!-- EJE PRIMARIO caja -->
  <line id="eje-prim" x1="390" y1="175" x2="430" y2="175" stroke="#1D9E75" stroke-width="5" stroke-linecap="round" opacity="1" marker-end="url(#atr)"/>

  <!-- CAJA DE CAMBIOS -->
  <rect x="430" y="120" width="100" height="110" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="480" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-primary)">Caja de</text>
  <text x="480" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-primary)">cambios</text>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">engranajes</text>
  <text x="480" y="214" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">1a · 2a · 3a · 4a · 5a</text>

  <!-- SEMIEJES -->
  <g id="g-semi">
    <line x1="530" y1="155" x2="610" y2="120" stroke="#BA7517" stroke-width="4" stroke-linecap="round" opacity="0" marker-end="url(#atr)"/>
    <line x1="530" y1="195" x2="610" y2="230" stroke="#BA7517" stroke-width="4" stroke-linecap="round" opacity="0" marker-end="url(#atr)"/>
    <text id="lbl-semi1" x="620" y="116" font-size="10" fill="#BA7517" opacity="0">rueda izq.</text>
    <text id="lbl-semi2" x="620" y="234" font-size="10" fill="#BA7517" opacity="0">rueda der.</text>
    <text id="lbl-semi3" x="572" y="108" text-anchor="middle" font-size="9" fill="#BA7517" opacity="0">semieje</text>
    <text id="lbl-semi4" x="572" y="248" text-anchor="middle" font-size="9" fill="#BA7517" opacity="0">semieje</text>
  </g>

  <!-- RUEDAS -->
  <g id="g-ruedas">
    <rect x="630" y="96" width="30" height="48" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0"/>
    <rect x="630" y="206" width="30" height="48" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0"/>
    <text id="r1" x="645" y="124" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)" opacity="0">🛞</text>
    <text id="r2" x="645" y="234" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)" opacity="0">🛞</text>
  </g>

  <!-- PEDAL -->
  <rect x="230" y="330" width="80" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="270" y="352" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-primary)">Pedal</text>
  <text x="270" y="368" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">embrague</text>
  <!-- Línea pedal → plato -->
  <line id="linea-pedal" x1="310" y1="355" x2="379" y2="230" stroke="var(--color-text-tertiary)" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="355" y="300" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)" opacity="0.6">cable/hidráulico</text>

  <!-- ESTADO ACTUAL (badge) -->
  <rect id="badge-bg" x="230" y="290" width="300" height="28" rx="6" fill="#1D9E75" opacity="0.15"/>
  <text id="badge-txt" x="380" y="309" text-anchor="middle" font-size="11" fill="#1D9E75">✓ Motor conectado a la caja — fuerza llega a ruedas</text>

  <!-- Flecha rotación motor → volante -->
  <path d="M 255 148 Q 240 175 255 202" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#atr)" opacity="0.5"/>
  <text id="rot-lbl" x="232" y="178" text-anchor="middle" font-size="9" fill="#1D9E75" opacity="0.7">gira</text>

  <!-- Nota inferior -->
  <text x="340" y="415" text-anchor="middle" font-size="11" fill="var(--color-text-tertiary)">En el Gol el embrague y la caja son una sola unidad — están pegados al motor</text>
</svg>
</div>

<script>
(function(){
  function setBtn(id) {
    ['soltado','pisado','camino'].forEach(function(k){
      var b = document.getElementById('e-'+k);
      if(!b) return;
      if(k===id){
        b.style.background='var(--color-background-info)'; b.style.color='var(--color-text-info)';
        b.style.borderColor='var(--color-border-info)'; b.style.fontWeight='500';
      } else {
        b.style.background='var(--color-background-secondary)'; b.style.color='var(--color-text-secondary)';
        b.style.borderColor='var(--color-border-secondary)'; b.style.fontWeight='400';
      }
    });
  }
  function op(id,val){ var e=document.getElementById(id); if(e) e.setAttribute('opacity',val); }
  function txt(id,val){ var e=document.getElementById(id); if(e) e.textContent=val; }
  function attr(id,a,v){ var e=document.getElementById(id); if(e) e.setAttribute(a,v); }

  window.showEmb = function(tab) {
    setBtn(tab);

    if(tab==='soltado'){
      txt('t-title','Embrague soltado');
      txt('t-1','El disco de embrague'); txt('t-2','está apretado entre');
      txt('t-3','el volante motor y'); txt('t-4','el plato de presión.');
      txt('t-5','La fuerza del motor'); txt('t-6','llega a la caja.');
      txt('t-7','Es el estado normal'); txt('t-8','mientras manejás.');
      txt('t-tip',''); txt('t-tip2','');
      document.getElementById('t-5').setAttribute('fill','#1D9E75');
      document.getElementById('t-6').setAttribute('fill','#1D9E75');

      // disco pegado al volante
      attr('disco-shape','cx','350'); attr('disco-shape','opacity','0.7');
      attr('disco-shape','fill','#534AB7');
      op('sep-emb',0);
      op('eje-prim',1);
      attr('eje-prim','stroke','#1D9E75');

      op('g-semi',0); op('g-ruedas',0);
      ['lbl-semi1','lbl-semi2','lbl-semi3','lbl-semi4','r1','r2'].forEach(function(id){ op(id,0); });

      attr('badge-bg','fill','#1D9E75');
      txt('badge-txt','✓ Motor conectado a la caja — fuerza llega a ruedas');
      document.getElementById('badge-txt').setAttribute('fill','#1D9E75');

    } else if(tab==='pisado'){
      txt('t-title','Embrague pisado');
      txt('t-1','El plato se separa del'); txt('t-2','disco. El motor sigue');
      txt('t-3','girando pero la caja'); txt('t-4','queda desconectada.');
      txt('t-5','Ahora podés cambiar'); txt('t-6','de marcha sin romper');
      txt('t-7','los engranajes.'); txt('t-8','');
      txt('t-tip','⚠ Pisarlo demasiado'); txt('t-tip2','tiempo gasta el disco');
      document.getElementById('t-5').setAttribute('fill','#BA7517');
      document.getElementById('t-6').setAttribute('fill','#BA7517');

      // disco separado
      attr('disco-shape','cx','344'); attr('disco-shape','opacity','0.5');
      attr('disco-shape','fill','#534AB7');
      op('sep-emb',1);
      op('eje-prim',0.15);
      attr('eje-prim','stroke','#888780');

      op('g-semi',0); op('g-ruedas',0);
      ['lbl-semi1','lbl-semi2','lbl-semi3','lbl-semi4','r1','r2'].forEach(function(id){ op(id,0); });

      attr('badge-bg','fill','#E24B4A');
      txt('badge-txt','✗ Motor desconectado — podés cambiar marcha');
      document.getElementById('badge-txt').setAttribute('fill','#E24B4A');

    } else {
      txt('t-title','Camino a las ruedas');
      txt('t-1','La caja selecciona'); txt('t-2','el engranaje (marcha).');
      txt('t-3','La fuerza sale por'); txt('t-4','dos semiejes —');
      txt('t-5','uno a cada rueda'); txt('t-6','delantera.');
      txt('t-7','El Gol es tracción'); txt('t-8','delantera.');
      txt('t-tip','El diferencial reparte'); txt('t-tip2','la fuerza entre las 2 ruedas');
      document.getElementById('t-5').setAttribute('fill','#BA7517');
      document.getElementById('t-6').setAttribute('fill','#BA7517');

      attr('disco-shape','cx','350'); attr('disco-shape','opacity','0.7');
      op('sep-emb',0);
      op('eje-prim',1);
      attr('eje-prim','stroke','#1D9E75');

      // semiejes y ruedas visibles
      ['lbl-semi1','lbl-semi2','lbl-semi3','lbl-semi4'].forEach(function(id){ op(id,1); });
      op('r1',1); op('r2',1);
      // líneas semiejes
      var s1 = document.querySelector('#g-semi line:first-child');
      var s2 = document.querySelector('#g-semi line:nth-child(2)');
      if(s1) s1.setAttribute('opacity','1');
      if(s2) s2.setAttribute('opacity','1');
      var rects = document.querySelectorAll('#g-ruedas rect');
      rects.forEach(function(r){ r.setAttribute('opacity','1'); });

      attr('badge-bg','fill','#BA7517');
      txt('badge-txt','→ Motor → Caja → Semiejes → Ruedas delanteras');
      document.getElementById('badge-txt').setAttribute('fill','#BA7517');
    }
  };

  window.showEmb('soltado');
})();
</script>
