
<div style="padding:8px 0">
<div style="display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap" id="ext-btns"></div>

<div id="ext-info" style="padding:12px 16px;background:var(--color-background-secondary);border-radius:8px;border:0.5px solid var(--color-border-info);margin-bottom:12px;min-height:80px">
  <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px" id="ext-title">Seleccioná un componente</div>
  <div style="font-size:12px;color:var(--color-text-secondary)" id="ext-body">Todo lo que está atornillado o conectado directamente al bloque del motor. Tocá cada uno.</div>
  <div style="font-size:11px;color:#BA7517;margin-top:6px" id="ext-tip"></div>
</div>

<svg width="100%" viewBox="0 0 680 480">

  <!-- BLOQUE MOTOR (centro) -->
  <rect x="220" y="140" width="240" height="200" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="2"/>
  <text x="340" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="var(--color-text-primary)">BLOQUE</text>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">motor</text>
  <text x="340" y="268" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)">pistones · bielas · cigüeñal</text>

  <!-- CULATA (arriba del bloque) -->
  <rect x="220" y="80" width="240" height="56" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
  <text x="340" y="112" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Culata + tapa válvulas</text>

  <!-- CÁRTER (abajo) -->
  <rect x="220" y="340" width="240" height="44" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
  <text x="340" y="366" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Cárter de aceite</text>

  <!-- ===== COMPONENTES EXTERNOS ===== -->

  <!-- ALTERNADOR — lateral izquierdo abajo -->
  <g id="e-alt">
    <rect x="60" y="290" width="110" height="60" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="115" y="316" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Alternador</text>
    <text x="115" y="332" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">lateral izq. inferior</text>
    <!-- polea -->
    <circle cx="170" cy="320" r="12" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <!-- correa -->
    <line x1="182" y1="315" x2="220" y2="305" stroke="#1D9E75" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <text x="200" y="300" text-anchor="middle" font-size="8" fill="#1D9E75">correa aux.</text>
  </g>

  <!-- BOMBA DE AGUA — lateral, en la correa distribución -->
  <g id="e-bagua">
    <rect x="60" y="180" width="110" height="60" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="115" y="206" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Bomba de agua</text>
    <text x="115" y="222" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">dentro de la tapa</text>
    <text x="115" y="234" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">de distribución</text>
    <!-- conexión -->
    <line x1="170" y1="210" x2="220" y2="210" stroke="#185FA5" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  </g>

  <!-- BOMBA DE ACEITE — frente del bloque abajo -->
  <g id="e-baceite">
    <rect x="60" y="370" width="110" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="115" y="391" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Bomba de aceite</text>
    <text x="115" y="407" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">frente inferior bloque</text>
    <line x1="170" y1="395" x2="220" y2="370" stroke="#BA7517" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  </g>

  <!-- BURRO DE ARRANQUE — trasero inferior -->
  <g id="e-burro">
    <rect x="60" y="80" width="110" height="60" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="115" y="104" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Burro arranque</text>
    <text x="115" y="120" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">entre motor y caja</text>
    <text x="115" y="132" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">trasero inferior</text>
    <line x1="170" y1="110" x2="220" y2="155" stroke="#534AB7" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  </g>

  <!-- CAJA DE CAMBIOS — lateral derecho -->
  <g id="e-caja">
    <rect x="510" y="155" width="130" height="170" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="575" y="232" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Caja de</text>
    <text x="575" y="248" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">cambios</text>
    <text x="575" y="268" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">+ diferencial</text>
    <text x="575" y="284" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">+ embrague adentro</text>
    <line x1="510" y1="240" x2="460" y2="240" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- Semiejes saliendo -->
    <line x1="510" y1="175" x2="560" y2="140" stroke="#BA7517" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="510" y1="310" x2="560" y2="345" stroke="#BA7517" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <text x="575" y="136" text-anchor="middle" font-size="8" fill="#BA7517">semieje</text>
    <text x="575" y="350" text-anchor="middle" font-size="8" fill="#BA7517">semieje</text>
  </g>

  <!-- TERMOSTATO — lateral culata -->
  <g id="e-termo">
    <rect x="510" y="80" width="110" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="565" y="101" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Termostato</text>
    <text x="565" y="117" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">en la culata lateral</text>
    <!-- manguera -->
    <line x1="510" y1="105" x2="460" y2="105" stroke="#185FA5" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <text x="485" y="98" text-anchor="middle" font-size="8" fill="#185FA5">manguera</text>
  </g>

  <!-- FILTRO ACEITE — lateral bloque -->
  <g id="e-filtro">
    <rect x="510" y="370" width="110" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="565" y="391" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Filtro de aceite</text>
    <text x="565" y="407" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">atornillado al bloque</text>
    <line x1="510" y1="395" x2="460" y2="380" stroke="#BA7517" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
  </g>

  <!-- DIRECCIÓN HIDRÁULICA — polea en correa aux -->
  <g id="e-dir">
    <rect x="510" y="290" width="110" height="60" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="565" y="314" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Bomba dirección</text>
    <text x="565" y="330" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">hidráulica</text>
    <text x="565" y="343" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">correa auxiliar</text>
    <line x1="510" y1="320" x2="460" y2="320" stroke="#1D9E75" stroke-width="2" stroke-dasharray="4 3" opacity="0.5"/>
  </g>

  <!-- COLECTOR ADMISIÓN — arriba culata -->
  <g id="e-adm">
    <rect x="240" y="20" width="200" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <text x="340" y="42" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Colector admisión</text>
    <text x="340" y="58" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">lleva aire a los 4 cilindros + cuerpo mariposa</text>
    <line x1="340" y1="70" x2="340" y2="80" stroke="var(--color-text-secondary)" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- COLECTOR ESCAPE — debajo culata lateral -->
  <g id="e-esc">
    <rect x="240" y="390" width="200" height="50" rx="8" fill="var(--color-background-secondary)" stroke="#888780" stroke-width="1"/>
    <text x="340" y="412" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Colector de escape</text>
    <text x="340" y="428" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">sale del motor → baja → catalizador</text>
    <line x1="340" y1="384" x2="340" y2="390" stroke="#888780" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- HIGHLIGHT -->
  <rect id="ext-hl" x="0" y="0" width="0" height="0" rx="10" fill="none" stroke="var(--color-border-info)" stroke-width="2.5" opacity="0"/>
</svg>
</div>

<script>
(function(){
  var comps = [
    {
      label: 'Alternador',
      rect: [58,288,114,64],
      title: 'Alternador — lateral izquierdo inferior',
      body: 'Atornillado al bloque del lado izquierdo, abajo. Lo mueve la correa auxiliar (la que NO es de distribución). Genera la electricidad que mantiene cargada la batería mientras el motor corre. Tiene un soporte ajustable para tensar la correa.',
      tip: 'Se puede ver y tocar fácil desde arriba asomándose al costado izquierdo del motor.'
    },
    {
      label: 'Bomba de agua',
      rect: [58,178,114,64],
      title: 'Bomba de agua — dentro de la tapa de distribución',
      body: 'Está escondida dentro de la tapa plástica de la distribución, en el lateral del motor. La mueve la correa de distribución — por eso cuando se cambia la correa, se cambia la bomba también. Si se rompe la bomba, la correa puede zafarse y fundir el motor.',
      tip: '⚠ Siempre cambiar junto con la correa de distribución — viene en el kit.'
    },
    {
      label: 'Bomba de aceite',
      rect: [58,368,114,54],
      title: 'Bomba de aceite — frente inferior del bloque',
      body: 'Está integrada al frente del bloque, en la parte más baja. La mueve directamente el cigüeñal mediante un engranaje — no tiene correa propia. Succiona el aceite del cárter y lo impulsa por los canales internos. No se ve desde afuera sin desmontar la tapa delantera.',
      tip: 'Es de las piezas más confiables del motor — raramente falla si el aceite se cambia en tiempo.'
    },
    {
      label: 'Burro de arranque',
      rect: [58,78,114,64],
      title: 'Burro de arranque — entre motor y caja de cambios',
      body: 'Atornillado en la unión entre el motor y la caja de cambios, en la parte trasera inferior. Tiene un piñón que engrana con la corona del volante motor para hacerlo girar al arrancar. Es eléctrico — recibe corriente directa de la batería cuando girás la llave.',
      tip: 'No se ve desde arriba — hay que mirar desde abajo o por el hueco entre motor y caja.'
    },
    {
      label: 'Caja de cambios',
      rect: [508,153,134,174],
      title: 'Caja de cambios — lateral derecho del motor',
      body: 'Está atornillada directamente al costado del bloque, formando una sola unidad. Adentro tiene los engranajes de las marchas, el diferencial y el embrague. De los costados salen los dos semiejes hacia las ruedas delanteras. El aceite de caja es diferente al del motor — tiene su propio nivel.',
      tip: '⚠ La caja tiene su propio aceite de transmisión — diferente al del motor. También se cambia cada ciertos km.'
    },
    {
      label: 'Termostato',
      rect: [508,78,112,54],
      title: 'Termostato — en la culata, lateral derecho',
      body: 'Está alojado en una carcasa de metal atornillada a la culata, donde sale la manguera superior hacia el radiador. Es una válvula automática que se abre cuando el motor alcanza temperatura de trabajo (~88°C). Fácil de cambiar — dos tornillos y una manguera.',
      tip: 'Si el motor tarda mucho en calentar o se recalienta sin razón → el termostato es lo primero a revisar.'
    },
    {
      label: 'Filtro de aceite',
      rect: [508,368,112,54],
      title: 'Filtro de aceite — lateral del bloque',
      body: 'Atornillado directamente al bloque, en el lateral. Es el componente más fácil de cambiar del motor — se saca con la mano o con una llave de filtro girando en sentido antihorario. Se cambia en cada cambio de aceite. Tiene una membrana interna que atrapa partículas metálicas y suciedad.',
      tip: 'Siempre poner un poco de aceite nuevo en la junta de goma antes de atornillar el filtro nuevo — evita fugas.'
    },
    {
      label: 'Bomba dirección',
      rect: [508,288,112,64],
      title: 'Bomba de dirección hidráulica — lateral derecho',
      body: 'En los modelos con dirección hidráulica, esta bomba está atornillada al bloque y la mueve la correa auxiliar. Genera la presión hidráulica que hace liviana la dirección. Tiene un depósito de líquido encima visible desde arriba. Si se rompe la correa auxiliar, perdés la dirección asistida.',
      tip: 'El Gol Trend puede tener dirección eléctrica (sin bomba) — en ese caso no existe esta pieza.'
    },
    {
      label: 'Colector admisión',
      rect: [238,18,204,54],
      title: 'Colector de admisión — encima de la culata',
      body: 'Es el plástico o aluminio que ves encima del motor distribuyendo el aire a los 4 cilindros. Tiene el cuerpo de mariposa (donde va el cable del acelerador o el sensor). En motores con inyección multipunto, los inyectores están justo donde el colector se une a la culata. Los sensores MAP y temperatura de aire van acá.',
      tip: 'Si el Gol tiene toma de aire fría (filtro de aire deportivo) — se conecta acá.'
    },
    {
      label: 'Colector escape',
      rect: [238,388,204,54],
      title: 'Colector de escape — debajo de la culata',
      body: 'Sale del motor por abajo, recoge los gases de los 4 cilindros en un solo tubo. Es la pieza más caliente del motor — puede llegar a 800°C. En el Gol suele ser de hierro fundido. De acá en adelante empieza el sistema de escape que ya vimos (catalizador → silenciadores → caño).',
      tip: '⚠ Nunca tocar con el motor caliente. Si está fisurado hace un ruido de "tick tick" cuando el motor arranca en frío.'
    }
  ];

  function op(id, val) { var e = document.getElementById(id); if(e) e.setAttribute('opacity', val); }

  var btnRow = document.getElementById('ext-btns');
  comps.forEach(function(c) {
    var b = document.createElement('button');
    b.textContent = c.label;
    b.style.cssText = 'cursor:pointer;padding:5px 10px;font-size:11px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);';
    b.addEventListener('click', function() {
      btnRow.querySelectorAll('button').forEach(function(btn) {
        btn.style.background = 'var(--color-background-secondary)';
        btn.style.color = 'var(--color-text-secondary)';
        btn.style.borderColor = 'var(--color-border-secondary)';
        btn.style.fontWeight = '400';
      });
      b.style.background = 'var(--color-background-info)';
      b.style.color = 'var(--color-text-info)';
      b.style.borderColor = 'var(--color-border-info)';
      b.style.fontWeight = '500';

      document.getElementById('ext-title').textContent = c.title;
      document.getElementById('ext-body').textContent = c.body;
      document.getElementById('ext-tip').textContent = c.tip;

      var hl = document.getElementById('ext-hl');
      hl.setAttribute('x', c.rect[0]-4);
      hl.setAttribute('y', c.rect[1]-4);
      hl.setAttribute('width', c.rect[2]+8);
      hl.setAttribute('height', c.rect[3]+8);
      op('ext-hl', 1);
    });
    btnRow.appendChild(b);
  });
})();
</script>
