
<div style="padding:8px 0">
<div style="display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap" id="tren-btns"></div>

<div id="tren-info" style="padding:14px 18px;background:var(--color-background-secondary);border-radius:10px;border:0.5px solid var(--color-border-info);margin-bottom:14px;min-height:100px">
  <div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px" id="tren-title">Seleccioná una pieza</div>
  <div style="font-size:12px;color:var(--color-text-secondary);line-height:1.7" id="tren-body">El tren delantero es todo lo que conecta el chasis a las ruedas delanteras. Tocá cada pieza.</div>
  <div style="font-size:11px;color:#BA7517;margin-top:8px" id="tren-tip"></div>
</div>

<svg width="100%" viewBox="0 0 680 460">
  <defs>
    <marker id="atr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- CHASIS (arriba centro) -->
  <rect x="200" y="20" width="280" height="30" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <text x="340" y="40" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Chasis / carrocería</text>

  <!-- AMORTIGUADOR + RESORTE izquierdo (McPherson) -->
  <g id="t-amort-iz">
    <!-- Resorte -->
    <path d="M 155 50 L 155 60 L 145 65 L 165 75 L 145 85 L 165 95 L 145 105 L 165 115 L 155 120" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
    <!-- Amortiguador (tubo) -->
    <rect x="148" y="120" width="14" height="80" rx="4" fill="var(--color-background-secondary)" stroke="#185FA5" stroke-width="1.5"/>
    <!-- Unión superior al chasis -->
    <line x1="155" y1="50" x2="200" y2="35" stroke="var(--color-border-secondary)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <text x="100" y="100" text-anchor="middle" font-size="9" fill="#185FA5">amort.</text>
    <text x="100" y="112" text-anchor="middle" font-size="9" fill="#185FA5">+ resorte</text>
    <line x1="118" y1="100" x2="145" y2="100" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.5"/>
  </g>

  <!-- MANGUETA izquierda -->
  <g id="t-mangueta-iz">
    <rect x="120" y="200" width="70" height="80" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="155" y="236" text-anchor="middle" font-size="10" font-weight="500" fill="var(--color-text-primary)">Mangueta</text>
    <text x="155" y="251" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">(porta-rueda)</text>
    <text x="155" y="265" text-anchor="middle" font-size="8" fill="var(--color-text-tertiary)">gira con dirección</text>
    <!-- Unión amortiguador → mangueta -->
    <line x1="155" y1="200" x2="155" y2="200" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <line x1="155" y1="200" x2="155" y2="200" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <line x1="148" y1="200" x2="148" y2="200" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <line x1="148" y1="200" x2="135" y2="200" stroke="var(--color-border-secondary)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- RUEDA izquierda -->
  <circle id="t-rueda-iz" cx="100" cy="320" r="60" fill="none" stroke="var(--color-border-secondary)" stroke-width="3"/>
  <circle cx="100" cy="320" r="20" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <text x="100" y="317" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">rueda</text>
  <text x="100" y="329" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">izq.</text>

  <!-- RODAMIENTO + BUJE -->
  <g id="t-rodamiento">
    <circle cx="100" cy="320" r="28" fill="none" stroke="#534AB7" stroke-width="2.5"/>
    <text x="40" y="290" text-anchor="end" font-size="9" fill="#534AB7">rodamiento</text>
    <text x="40" y="302" text-anchor="end" font-size="9" fill="#534AB7">+ buje</text>
    <line x1="42" y1="296" x2="72" y2="308" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.5"/>
  </g>

  <!-- FRENO DISCO izquierdo -->
  <g id="t-freno-iz">
    <circle cx="100" cy="320" r="48" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <text x="40" y="360" text-anchor="end" font-size="9" fill="#E24B4A">disco</text>
    <text x="40" y="372" text-anchor="end" font-size="9" fill="#E24B4A">freno</text>
    <line x1="42" y1="366" x2="52" y2="345" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.5"/>
  </g>

  <!-- BRAZO DE SUSPENSIÓN izquierdo -->
  <g id="t-brazo">
    <path d="M 190 280 Q 155 290 120 280" fill="none" stroke="#0F6E56" stroke-width="5" stroke-linecap="round"/>
    <!-- Silent block chasis -->
    <ellipse cx="190" cy="280" rx="10" ry="8" fill="#0F6E56" opacity="0.7"/>
    <!-- Rótula rueda -->
    <ellipse cx="120" cy="280" rx="8" ry="8" fill="#BA7517" opacity="0.9"/>
    <text x="160" y="310" text-anchor="middle" font-size="9" fill="#0F6E56">brazo suspensión</text>
    <text x="188" y="296" text-anchor="middle" font-size="8" fill="#0F6E56">silent</text>
    <text x="188" y="307" text-anchor="middle" font-size="8" fill="#0F6E56">block</text>
    <text x="120" y="298" text-anchor="middle" font-size="8" fill="#BA7517">rótula</text>
  </g>

  <!-- BARRA ESTABILIZADORA -->
  <g id="t-barra">
    <path d="M 160 380 Q 250 400 340 400 Q 430 400 520 380" fill="none" stroke="#854F0B" stroke-width="5" stroke-linecap="round"/>
    <text x="340" y="420" text-anchor="middle" font-size="10" font-weight="500" fill="#854F0B">Barra estabilizadora</text>
    <text x="340" y="434" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">evita que el auto se incline en curvas</text>
  </g>

  <!-- BIELETAS estabilizadoras -->
  <g id="t-bieletas">
    <!-- Izquierda -->
    <line x1="160" y1="380" x2="145" y2="310" stroke="#BA7517" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="160" cy="380" rx="7" ry="7" fill="#888780" opacity="0.7"/>
    <ellipse cx="145" cy="310" rx="7" ry="7" fill="#888780" opacity="0.7"/>
    <!-- Derecha -->
    <line x1="520" y1="380" x2="535" y2="310" stroke="#BA7517" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="520" cy="380" rx="7" ry="7" fill="#888780" opacity="0.7"/>
    <ellipse cx="535" cy="310" rx="7" ry="7" fill="#888780" opacity="0.7"/>
    <text x="130" y="345" text-anchor="end" font-size="9" fill="#BA7517">bieleta</text>
    <text x="130" y="357" text-anchor="end" font-size="9" fill="#BA7517">estab.</text>
  </g>

  <!-- SEMIEJE izquierdo -->
  <g id="t-semieje">
    <line x1="200" y1="320" x2="120" y2="320" stroke="#534AB7" stroke-width="5" stroke-linecap="round"/>
    <!-- Junta homocinética exterior -->
    <circle cx="120" cy="320" r="10" fill="#534AB7" opacity="0.8"/>
    <!-- Junta homocinética interior -->
    <circle cx="200" cy="320" r="8" fill="#534AB7" opacity="0.6"/>
    <text x="160" y="338" text-anchor="middle" font-size="9" fill="#534AB7">semieje</text>
    <text x="118" y="342" text-anchor="middle" font-size="7" fill="#534AB7">homo.</text>
    <text x="118" y="352" text-anchor="middle" font-size="7" fill="#534AB7">ext.</text>
    <text x="200" y="342" text-anchor="middle" font-size="7" fill="#534AB7">homo.</text>
    <text x="200" y="352" text-anchor="middle" font-size="7" fill="#534AB7">int.</text>
  </g>

  <!-- DIRECCIÓN / CREMALLERA -->
  <g id="t-cremallera">
    <rect x="210" y="250" width="260" height="24" rx="6" fill="var(--color-background-secondary)" stroke="#3B6D11" stroke-width="1.5"/>
    <text x="340" y="266" text-anchor="middle" font-size="10" font-weight="500" fill="#3B6D11">Cremallera de dirección</text>
    <!-- Tirantes -->
    <line x1="210" y1="262" x2="155" y2="240" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/>
    <line x1="470" y1="262" x2="525" y2="240" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="155" cy="240" rx="7" ry="7" fill="#3B6D11" opacity="0.7"/>
    <ellipse cx="525" cy="240" rx="7" ry="7" fill="#3B6D11" opacity="0.7"/>
    <text x="155" y="228" text-anchor="middle" font-size="8" fill="#3B6D11">tirante</text>
    <text x="525" y="228" text-anchor="middle" font-size="8" fill="#3B6D11">tirante</text>
  </g>

  <!-- LADO DERECHO (espejo) -->
  <!-- Amortiguador derecho -->
  <g id="t-amort-de">
    <path d="M 525 50 L 525 60 L 515 65 L 535 75 L 515 85 L 535 95 L 515 105 L 535 115 L 525 120" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
    <rect x="518" y="120" width="14" height="80" rx="4" fill="var(--color-background-secondary)" stroke="#185FA5" stroke-width="1.5"/>
    <line x1="525" y1="50" x2="480" y2="35" stroke="var(--color-border-secondary)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Mangueta derecha -->
  <rect x="490" y="200" width="70" height="80" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <text x="525" y="236" text-anchor="middle" font-size="10" font-weight="500" fill="var(--color-text-primary)">Mangueta</text>
  <text x="525" y="251" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">(porta-rueda)</text>
  <!-- Rueda derecha -->
  <circle cx="580" cy="320" r="60" fill="none" stroke="var(--color-border-secondary)" stroke-width="3"/>
  <circle cx="580" cy="320" r="20" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <text x="580" y="317" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">rueda</text>
  <text x="580" y="329" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">der.</text>
  <!-- Brazo derecho -->
  <path d="M 490 280 Q 525 290 560 280" fill="none" stroke="#0F6E56" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="490" cy="280" rx="10" ry="8" fill="#0F6E56" opacity="0.7"/>
  <ellipse cx="560" cy="280" rx="8" ry="8" fill="#BA7517" opacity="0.9"/>
  <!-- Semieje derecho -->
  <line x1="480" y1="320" x2="560" y2="320" stroke="#534AB7" stroke-width="5" stroke-linecap="round"/>
  <circle cx="560" cy="320" r="10" fill="#534AB7" opacity="0.8"/>
  <circle cx="480" cy="320" r="8" fill="#534AB7" opacity="0.6"/>

  <!-- HIGHLIGHT -->
  <rect id="tren-hl" x="0" y="0" width="0" height="0" rx="8" fill="none" stroke="var(--color-border-info)" stroke-width="2.5" opacity="0"/>
</svg>
</div>

<script>
(function(){
  var piezas = [
    {
      label: 'Amortiguador',
      rect: [90,45,130,165],
      title: 'Amortiguador + Resorte (McPherson)',
      body: 'En el Gol el amortiguador y el resorte son una sola unidad llamada "pata McPherson". El resorte absorbe el golpe inicial (el pozo), el amortiguador controla que el resorte no siga rebotando. Si el amortiguador falla, el auto rebota en cada pozo. Si el resorte se rompe, el auto queda de un lado más bajo.',
      tip: 'Test rápido: empujás el capó hacia abajo con fuerza y soltás. Si el auto rebota más de una vez → amortiguador gastado.',
      rep: 'SE CAMBIA — no se repara. Se cambian de a pares (los dos delanteros juntos).'
    },
    {
      label: 'Mangueta',
      rect: [118,198,74,84],
      title: 'Mangueta (porta-rueda)',
      body: 'Es la pieza central del tren delantero. Todo se une acá: el amortiguador arriba, el brazo de suspensión abajo, el semieje en el centro, los frenos adelante y los tirantes de dirección al costado. Gira cuando manejás el volante. Raramente falla sola — si se daña es por un golpe fuerte.',
      tip: 'Si el auto tuvo un choque fuerte en la rueda, lo primero que revisás es la mangueta — puede estar doblada aunque no se vea.',
      rep: 'SE CAMBIA si está doblada o fisurada. No se repara.'
    },
    {
      label: 'Brazo suspensión',
      rect: [115,268,85,30],
      title: 'Brazo de suspensión (triángulo inferior)',
      body: 'La barra que ves que va desde el chasis hasta la mangueta. En un extremo tiene un silent block de goma (unión al chasis) y en el otro tiene una rótula (unión a la mangueta). Lo que vos llamás "precap" con terminación de goma es esto — el silent block es esa goma.',
      tip: 'Ruido de "golpe" al pasar badenes o al frenar → silent block gastado. Ruido de "crack" al girar la dirección → rótula gastada.',
      rep: 'Silent block y rótula SE CAMBIAN. El brazo completo también se cambia si está doblado.'
    },
    {
      label: 'Rótula',
      rect: [112,272,20,20],
      title: 'Rótula — la articulación entre brazo y mangueta',
      body: 'Una rótula es básicamente una bolita de metal dentro de un alojamiento que permite movimiento en todas las direcciones. Une el brazo de suspensión a la mangueta. Con el tiempo el juego interno aumenta y aparece el ruido. Test: levantás la rueda con gato y la movés de arriba a abajo — si hay juego → rótula gastada.',
      tip: '⚠ Una rótula muy gastada puede separarse en movimiento — la rueda literalmente se cae. Es seguridad crítica.',
      rep: 'SE CAMBIA. En el Gol muchas veces viene integrada al brazo — se cambia el brazo completo.'
    },
    {
      label: 'Silent block',
      rect: [182,272,16,16],
      title: 'Silent block — la goma que une el brazo al chasis',
      body: 'Es un cilindro de goma con metal adentro que absorbe las vibraciones entre el brazo de suspensión y el chasis. Eso que vos describís como "una barra con terminación de goma" — la goma es el silent block. Con el tiempo la goma se seca, se agrieta y pierde su función. El auto empieza a transmitir todos los golpes directo al chasis.',
      tip: 'Ruido de "golpe sordo" al pasar badenes, especialmente en frío → silent block gastado. Se ve la goma agrietada a simple vista.',
      rep: 'SE CAMBIA con prensa hidráulica — no es trabajo de casa. Pero es barato el repuesto.'
    },
    {
      label: 'Barra estabilizadora',
      rect: [140,375,400,60],
      title: 'Barra estabilizadora — evita la inclinación en curvas',
      body: 'La barra que cruza de rueda a rueda por debajo. Cuando el auto dobla y se inclina, un lado baja y el otro sube — la barra estabilizadora transmite esa fuerza de un lado al otro resistiendo la inclinación. Sin esta barra el auto se echaría mucho en las curvas. Las bieletas la conectan a la suspensión.',
      tip: 'Para levantar el auto (lift) y que aguante mejor en tierra, se pueden poner bieletas más largas. Eso es parte de lo que querés hacer para el camino de tierra.',
      rep: 'La barra raramente falla. Lo que se gasta son los bujes de la barra (gomas) y las bieletas.'
    },
    {
      label: 'Bieletas',
      rect: [130,300,30,85],
      title: 'Bieletas estabilizadoras — lo que vos llamás "precap"',
      body: 'Son las barritas metálicas con terminaciones de goma (o rótulas) que conectan la barra estabilizadora a la suspensión. Eso que vos describís exactamente — barra metálica con terminación de goma. Cuando se gastan las terminaciones, aparece un ruido de "toc toc" o "clonc" al pasar badenes o al frenar. Son las piezas más baratas del tren delantero.',
      tip: '✓ Son de las piezas más fáciles y baratas de cambiar — dos tuercas y listo. En el Gol las conseguís por muy poco.',
      rep: 'SE CAMBIA. Muy fácil y barato. Podés hacerlo vos mismo.'
    },
    {
      label: 'Semieje + homocinéticas',
      rect: [110,308,100,24],
      title: 'Semieje + juntas homocinéticas',
      body: 'El semieje lleva la fuerza de la caja a la rueda. En los extremos tiene juntas homocinéticas (las bolitas que mencioné antes) que permiten que la rueda gire y se mueva con la suspensión. Se cubren con una bota de goma (fuelle). Cuando la bota se rompe, la grasa se va y la junta se seca → ruido de "crack crack" al doblar.',
      tip: '⚠ Revisar las botas a simple vista desde abajo — si están rotas y con grasa salpicada alrededor, la junta está en riesgo.',
      rep: 'Bota rota SE CAMBIA antes de que se dañe la junta. Junta dañada → se cambia el semieje completo.'
    },
    {
      label: 'Rodamiento + buje',
      rect: [72,292,56,56],
      title: 'Rodamiento de rueda (buje)',
      body: 'El rodamiento es lo que permite que la rueda gire libremente alrededor del semieje. Está prensado dentro de la mangueta. Cuando se gasta aparece un zumbido que aumenta con la velocidad — como un avión adentro del auto. Para confirmar: si el zumbido cambia al hacer una curva suave → es el rodamiento del lado que "descarga".',
      tip: 'Test definitivo: levantás la rueda con gato y la movés de lado a lado con las manos. Si hay juego o crujido → rodamiento gastado.',
      rep: 'SE CAMBIA con prensa hidráulica en taller. Repuesto accesible en precio.'
    },
    {
      label: 'Cremallera',
      rect: [208,248,264,28],
      title: 'Cremallera de dirección',
      body: 'Es el mecanismo que convierte el giro del volante en movimiento lateral de las ruedas. Los tirantes salen de cada extremo y se conectan a la mangueta. Cuando la cremallera tiene juego interno o los retenes se gastan (pierde líquido hidráulico), el volante empieza a tener juego o el auto no responde bien a la dirección.',
      tip: 'Pérdida de líquido hidráulico de dirección en el piso bajo el motor → retenes de la cremallera. Juego en el volante → desgaste interno.',
      rep: 'Retenes SE PUEDEN CAMBIAR. Cremallera muy desgastada SE CAMBIA completa.'
    }
  ];

  function op(id, val) { var e = document.getElementById(id); if(e) e.setAttribute('opacity', val); }

  var btnRow = document.getElementById('tren-btns');
  piezas.forEach(function(p) {
    var b = document.createElement('button');
    b.textContent = p.label;
    b.style.cssText = 'cursor:pointer;padding:5px 10px;font-size:11px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);';
    b.addEventListener('click', function() {
      btnRow.querySelectorAll('button').forEach(function(btn) {
        btn.style.background = 'var(--color-background-secondary)';
        btn.style.color = 'var(--color-text-secondary)';
        btn.style.borderColor = 'var(--color-border-secondary)';
        btn.style.fontWeight = '400';
      });
      b.style.background = 'var(--color-background-info)';
      b.style.color = 'var(--color-text-info)';
      b.style.borderColor = 'var(--color-border-info)';
      b.style.fontWeight = '500';

      document.getElementById('tren-title').textContent = p.title;
      document.getElementById('tren-body').textContent = p.body;
      document.getElementById('tren-tip').textContent = (p.tip || '') + (p.rep ? '\n' + p.rep : '');

      var hl = document.getElementById('tren-hl');
      hl.setAttribute('x', p.rect[0]-4);
      hl.setAttribute('y', p.rect[1]-4);
      hl.setAttribute('width', p.rect[2]+8);
      hl.setAttribute('height', p.rect[3]+8);
      op('tren-hl', 1);
    });
    btnRow.appendChild(b);
  });
})();
</script>
