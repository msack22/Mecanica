
<div style="padding:8px 0">
<div style="display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap" id="lift-btns"></div>

<div id="lift-info" style="padding:14px 18px;background:var(--color-background-secondary);border-radius:10px;border:0.5px solid var(--color-border-info);margin-bottom:14px;min-height:110px">
  <div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px" id="lift-title">Seleccioná una opción</div>
  <div style="font-size:12px;color:var(--color-text-secondary);line-height:1.7" id="lift-body">Para levantar el Gol hay varias opciones según cuánto querés subir y cuánto querés gastar.</div>
  <div style="font-size:11px;color:#BA7517;margin-top:8px" id="lift-tip"></div>
</div>

<svg width="100%" viewBox="0 0 680 320">

  <!-- Perfil auto (lado) -->
  <!-- Carrocería -->
  <rect x="100" y="120" width="440" height="80" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.5"/>
  <!-- Techo -->
  <rect x="180" y="80" width="260" height="44" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.5"/>

  <!-- Rueda delantera -->
  <circle id="rueda-del" cx="190" cy="230" r="50" fill="none" stroke="var(--color-border-secondary)" stroke-width="3"/>
  <circle cx="190" cy="230" r="16" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>

  <!-- Rueda trasera -->
  <circle id="rueda-tras" cx="450" cy="230" r="50" fill="none" stroke="var(--color-border-secondary)" stroke-width="3"/>
  <circle cx="450" cy="230" r="16" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>

  <!-- Piso -->
  <line x1="60" y1="280" x2="620" y2="280" stroke="var(--color-border-secondary)" stroke-width="1.5" opacity="0.4"/>

  <!-- Altura stock -->
  <line id="linea-stock" x1="60" y1="200" x2="620" y2="200" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
  <text x="62" y="197" font-size="9" fill="var(--color-text-tertiary)">altura stock</text>

  <!-- Flecha altura actual -->
  <line id="flecha-altura" x1="620" y1="200" x2="620" y2="280" stroke="#1D9E75" stroke-width="2" marker-end="url(#alift)" opacity="0.6"/>
  <line x1="620" y1="280" x2="620" y2="200" stroke="#1D9E75" stroke-width="2" marker-end="url(#alift)" opacity="0.6"/>
  <text id="txt-altura" x="635" y="243" font-size="10" fill="#1D9E75">~14cm</text>
  <defs>
    <marker id="alift" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Línea lift objetivo -->
  <line id="linea-lift" x1="60" y1="200" x2="620" y2="200" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 3" opacity="0"/>
  <text id="txt-lift-linea" x="62" y="190" font-size="9" fill="#BA7517" opacity="0">con lift</text>

  <!-- OPCIONES visuales -->
  <!-- Opción A: solo resortes -->
  <g id="opt-a">
    <rect x="100" y="50" width="120" height="30" rx="6" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1" opacity="0"/>
    <text id="opt-a-txt" x="160" y="69" text-anchor="middle" font-size="10" fill="#1D9E75" opacity="0">Opción A: +3cm</text>
  </g>
  <!-- Opción B: resortes + amort -->
  <g id="opt-b">
    <rect x="260" y="50" width="160" height="30" rx="6" fill="var(--color-background-secondary)" stroke="#BA7517" stroke-width="1" opacity="0"/>
    <text id="opt-b-txt" x="340" y="69" text-anchor="middle" font-size="10" fill="#BA7517" opacity="0">Opción B: +5cm</text>
  </g>
  <!-- Opción C: kit completo -->
  <g id="opt-c">
    <rect x="460" y="50" width="160" height="30" rx="6" fill="var(--color-background-secondary)" stroke="#E24B4A" stroke-width="1" opacity="0"/>
    <text id="opt-c-txt" x="540" y="69" text-anchor="middle" font-size="10" fill="#E24B4A" opacity="0">Opción C: +8cm</text>
  </g>

  <!-- Componentes que cambian -->
  <!-- Resorte nuevo (más largo) -->
  <g id="g-resorte-nuevo" opacity="0">
    <path d="M 160 170 L 160 178 L 150 184 L 170 192 L 150 200 L 170 208 L 160 214" fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
    <text x="160" y="160" text-anchor="middle" font-size="8" fill="#1D9E75">resorte +alto</text>
  </g>
  <!-- Bieletas largas -->
  <g id="g-bieletas-largas" opacity="0">
    <line x1="175" y1="255" x2="168" y2="220" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="175" cy="255" rx="6" ry="6" fill="#BA7517" opacity="0.7"/>
    <ellipse cx="168" cy="218" rx="6" ry="6" fill="#BA7517" opacity="0.7"/>
    <text x="150" y="240" text-anchor="end" font-size="8" fill="#BA7517">bieleta larga</text>
  </g>
</svg>
</div>

<script>
(function(){
  var opciones = [
    {
      label: 'A — Solo resortes (+3cm)',
      title: 'Opción A — Resortes más altos: la más simple',
      body: 'Cambiás los 4 resortes por unos de mayor altura (hay resortes de +3cm específicos para el Gol). Los amortiguadores de fábrica aguantan ese incremento si todavía están en buen estado. Es la opción más barata y fácil. El auto sube 3cm, gana algo más de guardabarro y mejora el paso en tierra.',
      tip: 'Costo aproximado Argentina: $80.000-$120.000 los 4 resortes. Se instalan en cualquier taller en 2-3 horas. Contra: si los amortiguadores ya están gastados, hay que cambiarlos igual.',
      liftY: 185, liftTxt: '+3cm',
      showA: true, showB: false, showC: false
    },
    {
      label: 'B — Resortes + amortiguadores (+5cm)',
      title: 'Opción B — Kit resortes + amortiguadores: la equilibrada',
      body: 'Resortes más altos combinados con amortiguadores de mayor recorrido. Los amortiguadores de fábrica tienen un recorrido limitado — si ponés resortes muy altos con amortiguadores cortos, el amortiguador llega a tope en los pozos y el golpe pasa directo al chasis. Combinando ambos el resultado es mucho mejor: más altura Y mejor absorción en tierra.',
      tip: 'Costo aproximado: $200.000-$350.000 los 4 conjuntos. Es la mejor opción para uso mixto ruta+tierra sin modificar geometría. Las bieletas más largas son opcionales pero recomendables.',
      liftY: 178, liftTxt: '+5cm',
      showA: true, showB: true, showC: false
    },
    {
      label: 'C — Kit lift completo (+8cm)',
      title: 'Opción C — Lift completo: máxima altura',
      body: 'Resortes altos + amortiguadores largos + bieletas estabilizadoras más largas + espaciadores de suspensión. Con esto llegás a +8cm que es prácticamente el límite del Gol sin modificar la geometría de la suspensión (camber, alineación). Más de 8cm empieza a afectar el comportamiento en ruta y el desgaste de neumáticos.',
      tip: '⚠ Con +8cm es OBLIGATORIO hacer una alineación y regulación de geometría después. El auto va a andar raro y va a comer cubiertas si no lo alineás. Costo lift completo: $400.000-$600.000 + alineación.',
      liftY: 168, liftTxt: '+8cm',
      showA: true, showB: true, showC: true
    },
    {
      label: '¿Qué comprar exactamente?',
      title: 'Lista de compras para el Gol Trend 2010/2011',
      body: 'Para la Opción B (la más recomendada): 4 resortes delanteros y traseros elevados +4/5cm para Gol Trend G5/G6, 4 amortiguadores de mayor recorrido (Sachs, Monroe o KYB son las marcas más confiables), 4 bieletas estabilizadoras largas. Todo se consigue en MercadoLibre Argentina buscando "lift Gol Trend" o en casas de tuning de Entre Ríos.',
      tip: 'Tip clave: comprá siempre resortes y amortiguadores de la misma marca y especificación. Marcas confiables disponibles en Argentina: Monroe, Sachs, KYB, Ángel o Stabilus. Evitá marcas sin nombre — la suspensión es seguridad.',
      liftY: 178, liftTxt: '+5cm',
      showA: true, showB: true, showC: false
    }
  ];

  function op(id, val) { var e = document.getElementById(id); if(e) e.setAttribute('opacity', val); }
  function attr(id, a, v) { var e = document.getElementById(id); if(e) e.setAttribute(a, v); }
  function txt(id, v) { var e = document.getElementById(id); if(e) e.textContent = v; }

  var btnRow = document.getElementById('lift-btns');
  opciones.forEach(function(o) {
    var b = document.createElement('button');
    b.textContent = o.label;
    b.style.cssText = 'cursor:pointer;padding:6px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);';
    b.addEventListener('click', function() {
      btnRow.querySelectorAll('button').forEach(function(btn) {
        btn.style.background = 'var(--color-background-secondary)';
        btn.style.color = 'var(--color-text-secondary)';
        btn.style.borderColor = 'var(--color-border-secondary)';
        btn.style.fontWeight = '400';
      });
      b.style.background = 'var(--color-background-info)';
      b.style.color = 'var(--color-text-info)';
      b.style.borderColor = 'var(--color-border-info)';
      b.style.fontWeight = '500';

      document.getElementById('lift-title').textContent = o.title;
      document.getElementById('lift-body').textContent = o.body;
      document.getElementById('lift-tip').textContent = o.tip;

      // línea lift
      var ll = document.getElementById('linea-lift');
      ll.setAttribute('y1', o.liftY); ll.setAttribute('y2', o.liftY);
      op('linea-lift', 1);
      var tll = document.getElementById('txt-lift-linea');
      tll.setAttribute('y', o.liftY - 4);
      op('txt-lift-linea', 1);
      txt('txt-altura', o.liftTxt);

      op('opt-a-txt', o.showA ? 1 : 0);
      op('opt-b-txt', o.showB ? 1 : 0);
      op('opt-c-txt', o.showC ? 1 : 0);
      op('g-resorte-nuevo', o.showA ? 1 : 0);
      op('g-bieletas-largas', o.showB ? 1 : 0);
    });
    btnRow.appendChild(b);
  });
})();
</script>
