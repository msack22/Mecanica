
<div style="padding:8px 0">
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
  <button onclick="showCon('bulon')" id="c-bulon" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info);font-weight:500">Bulón (pistón→biela)</button>
  <button onclick="showCon('munequilla')" id="c-munequilla" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Muñequilla (biela→cigüeñal)</button>
  <button onclick="showCon('valvulas')" id="c-valvulas" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Válvulas (leva→resorte)</button>
</div>

<svg width="100%" viewBox="0 0 680 420">
  <defs>
    <marker id="acon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INFO BOX -->
  <rect x="20" y="30" width="185" height="300" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text id="cn-title" x="112" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-text-primary)">El bulón</text>
  <text id="cn-1" x="112" y="82"  text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Pasador de acero que</text>
  <text id="cn-2" x="112" y="100" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">atraviesa el pistón y</text>
  <text id="cn-3" x="112" y="118" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">abraza la cabeza de</text>
  <text id="cn-4" x="112" y="136" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">la biela.</text>
  <text id="cn-5" x="112" y="164" text-anchor="middle" font-size="12" fill="#534AB7">Permite que la biela</text>
  <text id="cn-6" x="112" y="182" text-anchor="middle" font-size="12" fill="#534AB7">pivotee mientras el</text>
  <text id="cn-7" x="112" y="200" text-anchor="middle" font-size="12" fill="#534AB7">pistón sube y baja.</text>
  <text id="cn-8" x="112" y="228" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">El pistón solo va</text>
  <text id="cn-9" x="112" y="246" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">arriba y abajo —</text>
  <text id="cn-10" x="112" y="264" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">la biela convierte</text>
  <text id="cn-11" x="112" y="282" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">ese movimiento en</text>
  <text id="cn-12" x="112" y="300" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">rotación.</text>

  <!-- ===== CILINDRO ===== -->
  <!-- Paredes -->
  <rect x="280" y="60" width="14" height="260" rx="0" fill="var(--color-text-secondary)" opacity="0.15"/>
  <rect x="466" y="60" width="14" height="260" rx="0" fill="var(--color-text-secondary)" opacity="0.15"/>

  <!-- Árbol de levas (arriba) -->
  <rect x="280" y="60" width="200" height="10" rx="4" fill="var(--color-text-secondary)" opacity="0.2"/>
  <!-- Leva -->
  <ellipse id="leva-vis" cx="370" cy="58" rx="18" ry="22" fill="#BA7517" opacity="0"/>
  <text id="leva-lbl" x="370" y="44" text-anchor="middle" font-size="10" fill="#BA7517" opacity="0">leva</text>

  <!-- Resorte válvula -->
  <g id="g-resorte" opacity="0">
    <line x1="370" y1="80" x2="370" y2="100" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.5"/>
    <path d="M 362 100 Q 370 108 378 100 Q 386 92 378 84" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" opacity="0.5"/>
    <path d="M 362 108 Q 370 116 378 108" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5" opacity="0.5"/>
    <text x="410" y="100" font-size="10" fill="var(--color-text-secondary)" opacity="0.8">resorte</text>
  </g>

  <!-- VÁLVULA -->
  <g id="g-valvula" opacity="0">
    <rect x="362" y="116" width="16" height="60" rx="2" fill="#BA7517" opacity="0.7"/>
    <ellipse cx="370" cy="176" rx="20" ry="6" fill="#BA7517" opacity="0.6"/>
    <text x="430" y="148" font-size="11" font-weight="500" fill="#BA7517">válvula</text>
    <text x="430" y="164" font-size="10" fill="var(--color-text-secondary)">abre hacia abajo</text>
    <text x="430" y="180" font-size="10" fill="var(--color-text-secondary)">empujada por leva</text>
    <line x1="422" y1="155" x2="390" y2="155" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.5"/>
    <!-- resorte cierra -->
    <text x="430" y="200" font-size="10" fill="var(--color-text-secondary)">resorte la cierra</text>
    <text x="430" y="215" font-size="10" fill="var(--color-text-secondary)">cuando la leva pasa</text>
  </g>

  <!-- PISTÓN -->
  <rect id="piston-c" x="294" y="180" width="172" height="44" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
  <text x="380" y="206" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">pistón</text>

  <!-- BULÓN -->
  <rect id="bulon-shape" x="358" y="192" width="44" height="20" rx="10" fill="#E24B4A" opacity="0"/>
  <text id="bulon-lbl" x="470" y="204" font-size="11" font-weight="500" fill="#E24B4A" opacity="0">← bulón</text>
  <text id="bulon-lbl2" x="470" y="220" font-size="10" fill="var(--color-text-secondary)" opacity="0">pasador de acero</text>

  <!-- BIELA -->
  <rect id="biela-c" x="362" y="224" width="16" height="90" rx="4" fill="#534AB7" opacity="0.6"/>
  <text x="430" y="275" font-size="11" font-weight="500" fill="#534AB7">biela</text>
  <line x1="422" y1="270" x2="380" y2="270" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- MUÑEQUILLA -->
  <rect id="munequilla-shape" x="348" y="310" width="64" height="24" rx="8" fill="#1D9E75" opacity="0"/>
  <text id="mune-lbl" x="430" y="325" font-size="11" font-weight="500" fill="#1D9E75" opacity="0">← muñequilla</text>
  <text id="mune-lbl2" x="430" y="340" font-size="10" fill="var(--color-text-secondary)" opacity="0">donde biela abraza cigüeñal</text>

  <!-- CIGÜEÑAL -->
  <rect x="280" y="334" width="200" height="16" rx="6" fill="var(--color-text-secondary)" opacity="0.3"/>
  <text x="380" y="365" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">cigüeñal</text>

  <!-- Flechas movimiento -->
  <!-- Pistón sube/baja -->
  <line id="arrow-piston" x1="258" y1="175" x2="258" y2="215" stroke="#1D9E75" stroke-width="2" marker-end="url(#acon)" opacity="0.6"/>
  <text x="248" y="197" text-anchor="middle" font-size="9" fill="#1D9E75" opacity="0.7" transform="rotate(-90,248,197)">sube/baja</text>

  <!-- Cigüeñal gira -->
  <path d="M 252 334 Q 236 342 252 350" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#acon)" opacity="0.5"/>
  <text x="226" y="344" text-anchor="middle" font-size="9" fill="#1D9E75" opacity="0.7">gira</text>

  <!-- Válvula baja -->
  <line id="arrow-valv" x1="258" y1="130" x2="258" y2="170" stroke="#BA7517" stroke-width="2" marker-end="url(#acon)" opacity="0"/>
  <text id="lbl-valv-mov" x="242" y="153" text-anchor="middle" font-size="9" fill="#BA7517" opacity="0" transform="rotate(-90,242,153)">se abre</text>

  <!-- Notas inferiores -->
  <text id="nota-inf-c" x="380" y="400" text-anchor="middle" font-size="11" fill="var(--color-text-tertiary)">tocá cada pestaña para ver cómo se conecta cada parte</text>
</svg>
</div>

<script>
(function(){
  function setBtn(id) {
    ['bulon','munequilla','valvulas'].forEach(function(k){
      var b = document.getElementById('c-'+k);
      if(!b) return;
      if(k===id){
        b.style.background='var(--color-background-info)'; b.style.color='var(--color-text-info)';
        b.style.borderColor='var(--color-border-info)'; b.style.fontWeight='500';
      } else {
        b.style.background='var(--color-background-secondary)'; b.style.color='var(--color-text-secondary)';
        b.style.borderColor='var(--color-border-secondary)'; b.style.fontWeight='400';
      }
    });
  }
  function op(id,val){ var e=document.getElementById(id); if(e) e.setAttribute('opacity',val); }
  function txt(id,val){ var e=document.getElementById(id); if(e) e.textContent=val; }

  window.showCon = function(tab) {
    setBtn(tab);
    // reset highlights
    op('bulon-shape',0); op('bulon-lbl',0); op('bulon-lbl2',0);
    op('munequilla-shape',0); op('mune-lbl',0); op('mune-lbl2',0);
    op('g-valvula',0); op('g-resorte',0); op('leva-vis',0); op('leva-lbl',0);
    op('arrow-valv',0); op('lbl-valv-mov',0);

    if(tab==='bulon'){
      txt('cn-title','El bulón');
      txt('cn-1','Pasador de acero que'); txt('cn-2','atraviesa el pistón y');
      txt('cn-3','abraza la cabeza de'); txt('cn-4','la biela.');
      txt('cn-5','Permite que la biela'); txt('cn-6','pivotee mientras el');
      txt('cn-7','pistón sube y baja.');
      txt('cn-8','El pistón solo va'); txt('cn-9','arriba y abajo —');
      txt('cn-10','la biela convierte'); txt('cn-11','ese movimiento en');
      txt('cn-12','rotación.');
      document.getElementById('cn-5').setAttribute('fill','#534AB7');
      document.getElementById('cn-6').setAttribute('fill','#534AB7');
      document.getElementById('cn-7').setAttribute('fill','#534AB7');
      op('bulon-shape',0.9); op('bulon-lbl',1); op('bulon-lbl2',1);

    } else if(tab==='munequilla'){
      txt('cn-title','La muñequilla');
      txt('cn-1','Es el "codo" del cigüeñal.'); txt('cn-2','Está descentrada del eje');
      txt('cn-3','principal — eso es lo que'); txt('cn-4','convierte el empuje en');
      txt('cn-5','rotación.');
      txt('cn-6','La parte inferior de la'); txt('cn-7','biela abraza la muñequilla');
      txt('cn-8','con cojinetes de metal'); txt('cn-9','(están bañados en aceite');
      txt('cn-10','del sistema de lubricación'); txt('cn-11','que vimos).'); txt('cn-12','');
      document.getElementById('cn-5').setAttribute('fill','#1D9E75');
      document.getElementById('cn-6').setAttribute('fill','#1D9E75');
      document.getElementById('cn-7').setAttribute('fill','#1D9E75');
      op('munequilla-shape',0.9); op('mune-lbl',1); op('mune-lbl2',1);

    } else {
      txt('cn-title','Las válvulas');
      txt('cn-1','La leva empuja la'); txt('cn-2','válvula hacia abajo');
      txt('cn-3','para abrirla.'); txt('cn-4','');
      txt('cn-5','Un resorte la cierra'); txt('cn-6','automáticamente cuando');
      txt('cn-7','la leva sigue girando.');
      txt('cn-8','No hay biela ni bulón'); txt('cn-9','— es leva + resorte.');
      txt('cn-10','La correa de distribución'); txt('cn-11','asegura que esto pase');
      txt('cn-12','en el momento exacto.');
      document.getElementById('cn-5').setAttribute('fill','#BA7517');
      document.getElementById('cn-6').setAttribute('fill','#BA7517');
      document.getElementById('cn-7').setAttribute('fill','#BA7517');
      op('g-valvula',1); op('g-resorte',1);
      op('leva-vis',0.8); op('leva-lbl',1);
      op('arrow-valv',0.8); op('lbl-valv-mov',1);
    }
  };
  window.showCon('bulon');
})();
</script>
