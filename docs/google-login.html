<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión: Cuentas de Google</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #202124;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 450px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 40px;
      box-sizing: border-box;
      text-align: center;
    }
    .logo {
      height: 24px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 400;
      margin: 0 0 8px 0;
      color: #202124;
    }
    p {
      font-size: 16px;
      color: #5f6368;
      margin: 0 0 24px 0;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #1a73e8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
    }
    .link {
      color: #1a73e8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .link:hover {
      text-decoration: underline;
    }
    .btn-next {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-next:hover {
      background-color: #1557b0;
    }
    .error-msg {
      color: #d93025;
      font-size: 12px;
      margin-top: 6px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Google Logo SVG -->
    <svg class="logo" viewBox="0 0 74 24" width="74" height="24">
      <path d="M7.6 15.6c-2.3 0-4.3-1.8-4.3-4.2s2-4.2 4.3-4.2 4.3 1.8 4.3 4.2-2 4.2-4.3 4.2zM7.6 4.3C4.1 4.3 1.2 7.2 1.2 11.4s2.9 7.1 6.4 7.1 6.4-2.9 6.4-7.1-2.9-7.1-6.4-7.1zm17.5 11.3c-2.3 0-4.3-1.8-4.3-4.2s2-4.2 4.3-4.2 4.3 1.8 4.3 4.2-2 4.2-4.3 4.2zM25.1 4.3c-3.5 0-6.4 2.9-6.4 7.1s2.9 7.1 6.4 7.1 6.4-2.9 6.4-7.1-2.9-7.1-6.4-7.1zm15.1 12c-2.1 0-3.9-.9-4.7-2.4l11.4-4.7-.4-1c-.8-2.2-3.3-6.2-8.4-6.2-5 0-9.2 4-9.2 9.5 0 5.2 4.1 9.3 9.3 9.3 4.2 0 6.6-2.6 7.6-4.1l-2.5-1.7c-.8 1.2-2 2.3-3.8 2.3zm-.3-9.5c1.6 0 3 .8 3.5 2L31.8 12.3c0-4 2.9-5.5 4.3-5.5zM1.2 23.3h16V22H1.2v1.3zm55.3-7.7h-4.3v-4.1h4.3c1.2 0 2.2-.9 2.2-2s-1-2-2.2-2h-8v14.1h1.3v-5h6.7c1.2 0 2.2-1 2.2-2.1-.1-1.2-1.1-2.1-2.2-2.1zm-4.3 3.8v-2.5h4.3c.5 0 1 .4 1 1s-.5 1-1 1h-4.3zm19.1-13.6h-1.3v14.1h1.3V5.8zM49.6 15.6c-2.3 0-4.3-1.8-4.3-4.2s2-4.2 4.3-4.2 4.3 1.8 4.3 4.2-2.1 4.2-4.3 4.2zm0-11.3c-3.6 0-6.5 2.9-6.5 7.1s2.9 7.1 6.5 7.1 6.5-2.9 6.5-7.1-2.9-7.1-6.5-7.1zm-36.8.6v1.3h5.2c-.2.9-1.2 2.6-3.4 2.6-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5c1.1 0 1.8.5 2.2.9l1-1c-.8-.8-2-.1-3.2-.1-3.1 0-5.7 2.6-5.7 5.7s2.6 5.7 5.7 5.7c3.3 0 5.5-2.3 5.5-5.6 0-.4 0-.7-.1-.9h-5.4z" fill="#4285F4"/>
    </svg>
    <h1>Iniciar sesión</h1>
    <p>para continuar en Manual de Mecánica</p>
    
    <form id="loginForm">
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="nombre@gmail.com" value="tu-email@gmail.com">
        <div id="emailError" class="error-msg" style="display: none;"></div>
      </div>

      <div class="actions">
        <span class="link" onclick="window.close()">Cancelar</span>
        <button type="submit" class="btn-next">Siguiente</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const emailError = document.getElementById('emailError');
      
      if (!email) {
        emailError.textContent = 'Introduce un correo electrónico';
        emailError.style.display = 'block';
        return;
      }
      
      if (!email.endsWith('@gmail.com') && !email.includes('@')) {
        emailError.textContent = 'Introduce un correo electrónico válido';
        emailError.style.display = 'block';
        return;
      }

      // Extraer nombre aproximado del email para simular
      let name = email.split('@')[0];
      name = name.split(/[\._-]/).map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');

      // Comunicar éxito al parent window
      if (window.opener) {
        window.opener.postMessage({
          type: 'google-auth-success',
          email: email,
          name: name
        }, window.location.origin);
      }
      
      window.close();
    });
  </script>
</body>
</html>
