
<div style="padding:8px 0">
<div style="display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap" id="abajo-btns"></div>

<svg width="100%" viewBox="0 0 680 480">
  <defs>
    <marker id="aab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Contorno del auto desde abajo -->
  <rect x="60" y="20" width="560" height="440" rx="30" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.4"/>

  <!-- Ruedas (esquinas) -->
  <rect x="62" y="30" width="60" height="100" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.6"/>
  <rect x="558" y="30" width="60" height="100" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.6"/>
  <rect x="62" y="350" width="60" height="100" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.6"/>
  <rect x="558" y="350" width="60" height="100" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1" opacity="0.6"/>
  <text x="92" y="85" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)" transform="rotate(-90,92,85)">rueda</text>
  <text x="588" y="85" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)" transform="rotate(90,588,85)">rueda</text>
  <text x="92" y="405" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)" transform="rotate(-90,92,405)">rueda</text>
  <text x="588" y="405" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)" transform="rotate(90,588,405)">rueda</text>

  <!-- Etiqueta frente/atrás -->
  <text x="340" y="16" text-anchor="middle" font-size="11" fill="var(--color-text-tertiary)">▲ FRENTE (motor)</text>
  <text x="340" y="474" text-anchor="middle" font-size="11" fill="var(--color-text-tertiary)">▼ ATRÁS (maletero)</text>

  <!-- ===== ZONA MOTOR (adelante) ===== -->
  <!-- Motor + caja -->
  <g id="c-motor-ab" class="node" onclick="selectAb('motor')">
    <rect x="190" y="40" width="160" height="100" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="270" y="85" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-primary)">Motor</text>
    <text x="270" y="101" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">bloque + culata</text>
  </g>

  <!-- Caja de cambios -->
  <g id="c-caja-ab" class="node" onclick="selectAb('caja')">
    <rect x="350" y="40" width="120" height="100" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="410" y="82" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Caja de</text>
    <text x="410" y="97" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">cambios</text>
    <text x="410" y="114" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">+ diferencial</text>
  </g>

  <!-- Cárter aceite -->
  <g id="c-carter-ab" class="node" onclick="selectAb('carter')">
    <rect x="210" y="155" width="120" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="270" y="177" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Cárter</text>
    <text x="270" y="193" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">tapón abajo</text>
  </g>

  <!-- Semiejes -->
  <g id="c-semiejes-ab" class="node" onclick="selectAb('semiejes')">
    <!-- Semieje izquierdo -->
    <line x1="122" y1="80" x2="190" y2="80" stroke="#BA7517" stroke-width="5" stroke-linecap="round"/>
    <!-- Semieje derecho -->
    <line x1="470" y1="80" x2="558" y2="80" stroke="#BA7517" stroke-width="5" stroke-linecap="round"/>
    <text x="150" y="70" text-anchor="middle" font-size="9" fill="#BA7517">semieje</text>
    <text x="514" y="70" text-anchor="middle" font-size="9" fill="#BA7517">semieje</text>
  </g>

  <!-- Dirección -->
  <g id="c-direccion-ab" class="node" onclick="selectAb('direccion')">
    <rect x="155" y="155" width="50" height="50" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="180" y="177" text-anchor="middle" font-size="9" font-weight="500" fill="var(--color-text-primary)">Direc-</text>
    <text x="180" y="191" text-anchor="middle" font-size="9" fill="var(--color-text-primary)">ción</text>
    <!-- Barra de dirección -->
    <line x1="122" y1="180" x2="155" y2="180" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="205" y1="180" x2="350" y2="180" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="400" y1="180" x2="480" y2="180" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="480" y1="180" x2="558" y2="180" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <text x="340" y="173" text-anchor="middle" font-size="9" fill="var(--color-text-tertiary)">barra de dirección</text>
  </g>

  <!-- Amortiguadores delanteros -->
  <g id="c-amort-ab" class="node" onclick="selectAb('amortiguadores')">
    <circle cx="130" cy="55" r="18" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="130" y="52" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">amort.</text>
    <text x="130" y="63" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">del.</text>
    <circle cx="550" cy="55" r="18" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="550" y="52" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">amort.</text>
    <text x="550" y="63" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">del.</text>
    <!-- Amortiguadores traseros -->
    <circle cx="130" cy="400" r="18" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="130" y="397" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">amort.</text>
    <text x="130" y="408" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">tras.</text>
    <circle cx="550" cy="400" r="18" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="550" y="397" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">amort.</text>
    <text x="550" y="408" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">tras.</text>
  </g>

  <!-- ESCAPE -->
  <g id="c-escape-ab" class="node" onclick="selectAb('escape')">
    <!-- Manifold escape -->
    <rect x="350" y="155" width="80" height="30" rx="5" fill="var(--color-background-secondary)" stroke="#888780" stroke-width="1"/>
    <text x="390" y="175" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">manifold</text>
    <!-- Tubo escape baja -->
    <line x1="390" y1="185" x2="390" y2="230" stroke="#888780" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- Catalizador -->
    <rect x="365" y="230" width="50" height="36" rx="6" fill="var(--color-background-secondary)" stroke="#888780" stroke-width="1"/>
    <text x="390" y="251" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">catali-</text>
    <text x="390" y="263" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">zador</text>
    <!-- Tubo central -->
    <line x1="390" y1="266" x2="390" y2="310" stroke="#888780" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- Silenciador intermedio -->
    <rect x="355" y="310" width="70" height="30" rx="6" fill="var(--color-background-secondary)" stroke="#888780" stroke-width="1"/>
    <text x="390" y="330" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">silenciador</text>
    <!-- Tubo hacia atrás -->
    <line x1="390" y1="340" x2="390" y2="390" stroke="#888780" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- Silenciador final -->
    <rect x="350" y="390" width="80" height="36" rx="6" fill="var(--color-background-secondary)" stroke="#888780" stroke-width="1"/>
    <text x="390" y="411" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">silenciador</text>
    <text x="390" y="423" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">final</text>
    <!-- Label escape -->
    <text x="445" y="295" font-size="11" font-weight="500" fill="#888780">Escape</text>
    <line x1="440" y1="295" x2="415" y2="295" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.5"/>
  </g>

  <!-- TANQUE NAFTA -->
  <g id="c-tanque-ab" class="node" onclick="selectAb('tanque')">
    <rect x="175" y="340" width="160" height="80" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="255" y="378" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-primary)">Tanque</text>
    <text x="255" y="395" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">nafta — bajo el asiento</text>
  </g>

  <!-- FRENOS traseros -->
  <g id="c-frenos-ab" class="node" onclick="selectAb('frenos')">
    <rect x="480" y="360" width="70" height="50" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="515" y="382" text-anchor="middle" font-size="10" font-weight="500" fill="var(--color-text-primary)">Frenos</text>
    <text x="515" y="397" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">traseros</text>
    <!-- Frenos delanteros -->
    <rect x="140" y="30" width="50" height="40" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="165" y="48" text-anchor="middle" font-size="9" font-weight="500" fill="var(--color-text-primary)">Frenos</text>
    <text x="165" y="61" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">del.</text>
    <rect x="490" y="30" width="60" height="40" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="520" y="48" text-anchor="middle" font-size="9" font-weight="500" fill="var(--color-text-primary)">Frenos</text>
    <text x="520" y="61" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">del.</text>
  </g>

  <!-- INFO BOX -->
  <rect id="info-ab-box" x="155" y="220" width="190" height="110" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-info)" stroke-width="1" opacity="0"/>
  <text id="info-ab-title" x="250" y="248" text-anchor="middle" font-size="13" font-weight="500" fill="var(--color-text-primary)" opacity="0"></text>
  <text id="info-ab-1" x="250" y="268" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)" opacity="0"></text>
  <text id="info-ab-2" x="250" y="284" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)" opacity="0"></text>
  <text id="info-ab-3" x="250" y="300" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)" opacity="0"></text>
  <text id="info-ab-4" x="250" y="316" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)" opacity="0"></text>
</svg>

<!-- Leyenda -->
<div style="display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 0;font-size:12px;color:var(--color-text-secondary)">
  <span>🟤 <b>adelante</b> = motor, caja, semiejes, dirección</span>
  <span>⬜ <b>centro</b> = escape corre de adelante a atrás</span>
  <span>🟤 <b>atrás</b> = tanque, frenos traseros, amortiguadores</span>
</div>
</div>

<script>
(function(){
  var tabs = [
    {id:'todos', label:'Todos'},
    {id:'motor', label:'Motor/Caja'},
    {id:'escape', label:'Escape'},
    {id:'suspension', label:'Suspensión'},
    {id:'otros', label:'Tanque/Frenos'}
  ];

  var infos = {
    motor: {
      title:'Motor y caja de cambios',
      l1:'Están pegados, adelante.',
      l2:'La caja sale hacia un costado.',
      l3:'Los semiejes van de la caja',
      l4:'a cada rueda delantera.'
    },
    caja: {
      title:'Caja de cambios',
      l1:'Pegada al costado del motor.',
      l2:'De acá salen los 2 semiejes.',
      l3:'El diferencial está adentro.',
      l4:'Se ve claramente desde abajo.'
    },
    carter: {
      title:'Cárter de aceite',
      l1:'La pieza más baja del motor.',
      l2:'Tiene un tapón para drenar',
      l3:'el aceite en cada cambio.',
      l4:'Lo primero que ves al mirar.'
    },
    semiejes: {
      title:'Semiejes',
      l1:'2 barras que salen de la caja.',
      l2:'Van a cada rueda delantera.',
      l3:'Tienen juntas homocinéticas',
      l4:'en los extremos (tipo bola).'
    },
    direccion: {
      title:'Dirección',
      l1:'Barra que cruza de rueda',
      l2:'a rueda. En el Gol es',
      l3:'dirección asistida hidráulica.',
      l4:'Se ve claramente atravesando.'
    },
    amortiguadores: {
      title:'Amortiguadores',
      l1:'4 en total, uno por rueda.',
      l2:'Delanteros: tipo telescópico.',
      l3:'Traseros: más simples.',
      l4:'Fáciles de ver y cambiar.'
    },
    escape: {
      title:'Sistema de escape',
      l1:'Sale del motor, baja,',
      l2:'pasa por el catalizador,',
      l3:'luego 2 silenciadores',
      l4:'y termina atrás del auto.'
    },
    tanque: {
      title:'Tanque de nafta',
      l1:'Está debajo del asiento',
      l2:'trasero, centrado.',
      l3:'La bomba de nafta está',
      l4:'adentro del tanque.'
    },
    frenos: {
      title:'Frenos',
      l1:'Delanteros: discos (se ven).',
      l2:'Traseros en el Gol: tambores',
      l3:'o discos según el año.',
      l4:'Pastillas/zapatas adentro.'
    }
  };

  function op(id, val) { var e = document.getElementById(id); if(e) e.setAttribute('opacity', val); }

  function clearHighlights() {
    var all = ['c-motor-ab','c-caja-ab','c-carter-ab','c-semiejes-ab',
               'c-direccion-ab','c-amort-ab','c-escape-ab','c-tanque-ab','c-frenos-ab'];
    all.forEach(function(id) {
      var el = document.getElementById(id);
      if(el) { var r = el.querySelector('rect,circle,line'); }
    });
    op('info-ab-box', 0);
    op('info-ab-title', 0);
    ['info-ab-1','info-ab-2','info-ab-3','info-ab-4'].forEach(function(id){ op(id,0); });
  }

  window.selectAb = function(id) {
    clearHighlights();
    var info = infos[id];
    if(!info) return;
    op('info-ab-box', 1);
    op('info-ab-title', 1);
    document.getElementById('info-ab-title').textContent = info.title;
    ['l1','l2','l3','l4'].forEach(function(k, i) {
      var el = document.getElementById('info-ab-'+(i+1));
      if(el) { el.textContent = info[k]; op('info-ab-'+(i+1), 1); }
    });
  };

  var btnRow = document.getElementById('abajo-btns');
  tabs.forEach(function(t) {
    var b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.id = t.id;
    b.style.cssText = 'cursor:pointer;padding:5px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);';
    b.addEventListener('click', function() {
      btnRow.querySelectorAll('button').forEach(function(btn) {
        btn.style.background = 'var(--color-background-secondary)';
        btn.style.color = 'var(--color-text-secondary)';
        btn.style.borderColor = 'var(--color-border-secondary)';
        btn.style.fontWeight = '400';
      });
      b.style.background = 'var(--color-background-info)';
      b.style.color = 'var(--color-text-info)';
      b.style.borderColor = 'var(--color-border-info)';
      b.style.fontWeight = '500';
      clearHighlights();
    });
    btnRow.appendChild(b);
  });

  btnRow.querySelectorAll('button')[0].click();
})();
</script>
