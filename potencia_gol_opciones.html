
<div style="padding:8px 0">
<div style="display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap" id="pot-btns"></div>

<div id="pot-info" style="padding:12px 16px;background:var(--color-background-secondary);border-radius:8px;border:0.5px solid var(--color-border-info);margin-bottom:12px;min-height:90px">
  <div style="font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:4px" id="pot-title">Seleccioná una opción</div>
  <div style="font-size:12px;color:var(--color-text-secondary)" id="pot-body">Hay varias formas de ganar potencia. Algunas son seguras, otras no tanto.</div>
  <div style="font-size:11px;color:#BA7517;margin-top:6px" id="pot-tip"></div>
</div>

<svg width="100%" viewBox="0 0 680 360">

  <!-- Eje base: 110 hp -->
  <rect x="40" y="30" width="600" height="30" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="50" y="50" font-size="11" fill="var(--color-text-secondary)">Base: 110 hp (Gol 1.6 MSI de fábrica)</text>

  <!-- Barra base -->
  <rect x="40" y="70" width="220" height="24" rx="4" fill="var(--color-text-secondary)" opacity="0.3"/>
  <text x="270" y="86" font-size="11" fill="var(--color-text-secondary)">110 hp</text>

  <!-- OPCIONES DE POTENCIA -->

  <!-- 1. Reprogramación ECU (remap) -->
  <g id="p-remap">
    <rect x="40" y="110" width="300" height="24" rx="4" fill="#1D9E75" opacity="0.7"/>
    <text x="350" y="126" font-size="11" fill="var(--color-text-secondary)">~125-130 hp</text>
    <text x="40" y="150" font-size="10" fill="var(--color-text-tertiary)">Reprogramación ECU (remap)</text>
  </g>

  <!-- 2. Escape + admisión -->
  <g id="p-escape">
    <rect x="40" y="165" width="260" height="24" rx="4" fill="#BA7517" opacity="0.6"/>
    <text x="310" y="181" font-size="11" fill="var(--color-text-secondary)">~118-122 hp</text>
    <text x="40" y="205" font-size="10" fill="var(--color-text-tertiary)">Escape deportivo + admisión fría</text>
  </g>

  <!-- 3. Remap + escape + admisión -->
  <g id="p-combo">
    <rect x="40" y="220" width="360" height="24" rx="4" fill="#1D9E75" opacity="0.85"/>
    <text x="410" y="236" font-size="11" fill="var(--color-text-secondary)">~135-140 hp</text>
    <text x="40" y="260" font-size="10" fill="var(--color-text-tertiary)">Combo: remap + escape + admisión</text>
  </g>

  <!-- 4. Turbo kit -->
  <g id="p-turbo">
    <rect x="40" y="275" width="500" height="24" rx="4" fill="#E24B4A" opacity="0.7"/>
    <text x="550" y="291" font-size="11" fill="var(--color-text-secondary)">~160-180 hp</text>
    <text x="40" y="315" font-size="10" fill="var(--color-text-tertiary)">Kit turbo (riesgoso sin reforzar motor)</text>
  </g>

  <!-- Línea objetivo 150hp -->
  <line x1="40" y1="70" x2="40" y2="330" stroke="var(--color-border-tertiary)" stroke-width="0.5" opacity="0.5"/>
  <line x1="400" y1="60" x2="400" y2="330" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="402" y="56" font-size="10" fill="#E24B4A">← 150 hp</text>

  <!-- Escala hp -->
  <text x="40" y="345" font-size="9" fill="var(--color-text-tertiary)">110</text>
  <text x="180" y="345" font-size="9" fill="var(--color-text-tertiary)">120</text>
  <text x="310" y="345" font-size="9" fill="var(--color-text-tertiary)">130</text>
  <text x="400" y="345" font-size="9" fill="var(--color-text-tertiary)">150</text>
  <text x="530" y="345" font-size="9" fill="var(--color-text-tertiary)">170</text>

  <!-- Highlight -->
  <rect id="pot-hl" x="0" y="0" width="0" height="0" rx="6" fill="var(--color-border-info)" opacity="0"/>
</svg>
</div>

<script>
(function(){
  var opciones = [
    {
      label: 'Remap ECU',
      rect: [38,108,264,68],
      title: 'Reprogramación ECU (remap) — la mejor opción',
      body: 'La computadora del auto tiene parámetros conservadores de fábrica (adelanto de encendido, cantidad de nafta, presión de turbo si lo tiene). Un remap ajusta esos parámetros para exprimir más del motor. En el 1.6 MSI podés ganar 15-20 hp sin tocar ninguna pieza mecánica. Es reversible, no desgasta el motor si se hace bien, y el costo es bajo.',
      tip: '✓ Mejor relación costo/potencia. Buscar un lugar con buenas referencias — un remap mal hecho sí puede dañar el motor.'
    },
    {
      label: 'Escape + admisión',
      rect: [38,163,264,64],
      title: 'Escape deportivo + admisión fría',
      body: 'Escape deportivo (colector 4-1 + caño de mayor diámetro) y filtro de admisión de aire frío. El motor respira mejor por ambos lados. Ganás 8-12 hp reales — menos de lo que prometen en los catálogos. No desgasta el motor, pero el costo es mayor que el remap para una ganancia menor.',
      tip: 'El colector deportivo es donde está la mayor ganancia del escape — no solo cambiar el caño final.'
    },
    {
      label: 'Combo (remap+escape)',
      rect: [38,218,324,64],
      title: 'Combo: remap + escape + admisión — la mejor relación',
      body: 'Combinar el remap con mejoras en admisión y escape es donde la suma es mayor que las partes — el remap puede aprovechar mejor el aire extra que entra y la salida más fluida de gases. Podés llegar a 135-140 hp de forma confiable y duradera en el 1.6 MSI sin tocar el motor internamente.',
      tip: '✓ Este combo es el límite seguro sin reforzar el motor. Más allá de acá el motor empieza a sufrir.'
    },
    {
      label: 'Kit turbo',
      rect: [38,273,464,64],
      title: 'Kit turbo — llega a 150 hp pero requiere reforzar',
      body: 'Un turbo en un motor atmosférico sí llega a 150-180 hp, pero el problema es que el motor de fábrica no está diseñado para esa presión. Las bielas, pistones y junta de culata son los puntos débiles. Para hacerlo bien y que dure hay que reforzar internamente el motor (forjado) — lo que multiplica el costo. Sin reforzar, el motor puede aguantar meses o años pero termina cediendo.',
      tip: '⚠ Un turbo sin reforzar el motor internamente es una bomba de tiempo. El costo total bien hecho supera ampliamente el valor del auto.'
    }
  ];

  function op(id, val) { var e = document.getElementById(id); if(e) e.setAttribute('opacity', val); }

  var btnRow = document.getElementById('pot-btns');
  opciones.forEach(function(o) {
    var b = document.createElement('button');
    b.textContent = o.label;
    b.style.cssText = 'cursor:pointer;padding:6px 12px;font-size:12px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);';
    b.addEventListener('click', function() {
      btnRow.querySelectorAll('button').forEach(function(btn) {
        btn.style.background = 'var(--color-background-secondary)';
        btn.style.color = 'var(--color-text-secondary)';
        btn.style.borderColor = 'var(--color-border-secondary)';
        btn.style.fontWeight = '400';
      });
      b.style.background = 'var(--color-background-info)';
      b.style.color = 'var(--color-text-info)';
      b.style.borderColor = 'var(--color-border-info)';
      b.style.fontWeight = '500';

      document.getElementById('pot-title').textContent = o.title;
      document.getElementById('pot-body').textContent = o.body;
      document.getElementById('pot-tip').textContent = o.tip;

      var hl = document.getElementById('pot-hl');
      hl.setAttribute('x', o.rect[0]);
      hl.setAttribute('y', o.rect[1]);
      hl.setAttribute('width', o.rect[2]);
      hl.setAttribute('height', o.rect[3]);
      op('pot-hl', 0.15);
    });
    btnRow.appendChild(b);
  });
})();
</script>
