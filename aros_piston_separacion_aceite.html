
<div style="padding:8px 0">
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
  <button onclick="showAro('normal')" id="tab-normal" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info);font-weight:500">Motor sano</button>
  <button onclick="showAro('falla')" id="tab-falla" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Cuando falla (aros gastados)</button>
</div>

<svg width="100%" viewBox="0 0 680 400">

  <!-- Info box -->
  <rect x="20" y="30" width="190" height="280" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text id="inf-title" x="115" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-text-primary)">Motor sano</text>
  <text id="inf-1" x="115" y="82"  text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">El pistón tiene 3 aros</text>
  <text id="inf-2" x="115" y="100" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">de metal que sellan</text>
  <text id="inf-3" x="115" y="118" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">contra la pared del</text>
  <text id="inf-4" x="115" y="136" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">cilindro.</text>
  <text id="inf-5" x="115" y="164" text-anchor="middle" font-size="12" fill="#1D9E75">Arriba: zona de combustión</text>
  <text id="inf-6" x="115" y="182" text-anchor="middle" font-size="12" fill="#1D9E75">(nafta + aire + chispa)</text>
  <text id="inf-7" x="115" y="210" text-anchor="middle" font-size="12" fill="#BA7517">Abajo: zona de aceite</text>
  <text id="inf-8" x="115" y="228" text-anchor="middle" font-size="12" fill="#BA7517">(lubrica las paredes)</text>
  <text id="inf-9" x="115" y="256" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Los aros separan</text>
  <text id="inf-10" x="115" y="274" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">ambas zonas.</text>

  <!-- CILINDRO pared izquierda -->
  <rect x="270" y="40" width="18" height="330" rx="0" fill="var(--color-text-secondary)" opacity="0.2"/>
  <!-- CILINDRO pared derecha -->
  <rect x="512" y="40" width="18" height="330" rx="0" fill="var(--color-text-secondary)" opacity="0.2"/>

  <!-- ZONA COMBUSTION (arriba, verde) -->
  <rect x="288" y="40" width="224" height="120" rx="0" fill="#1D9E75" opacity="0.08"/>
  <text x="400" y="70" text-anchor="middle" font-size="12" fill="#1D9E75" opacity="0.9">ZONA COMBUSTIÓN</text>
  <text x="400" y="88" text-anchor="middle" font-size="11" fill="#1D9E75" opacity="0.7">nafta + aire</text>
  <text x="400" y="104" text-anchor="middle" font-size="11" fill="#1D9E75" opacity="0.7">nunca entra aceite acá</text>

  <!-- ZONA ACEITE (abajo, ámbar) -->
  <rect id="zona-aceite" x="288" y="290" width="224" height="80" rx="0" fill="#BA7517" opacity="0.12"/>
  <text x="400" y="322" text-anchor="middle" font-size="12" fill="#BA7517" opacity="0.9">ZONA ACEITE</text>
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#BA7517" opacity="0.7">lubrica paredes del cilindro</text>

  <!-- PISTÓN -->
  <rect id="piston-body" x="300" y="155" width="200" height="120" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
  <text x="400" y="222" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">pistón</text>

  <!-- ARO 1 — compresión (arriba) -->
  <rect id="aro1" x="288" y="158" width="14" height="10" rx="2" fill="#534AB7"/>
  <rect id="aro1r" x="526" y="158" width="14" height="10" rx="2" fill="#534AB7"/>
  <text x="548" y="167" font-size="10" fill="#534AB7">aro compresión 1</text>

  <!-- ARO 2 — compresión (medio) -->
  <rect id="aro2" x="288" y="178" width="14" height="10" rx="2" fill="#534AB7"/>
  <rect id="aro2r" x="526" y="178" width="14" height="10" rx="2" fill="#534AB7"/>
  <text x="548" y="187" font-size="10" fill="#534AB7">aro compresión 2</text>

  <!-- ARO 3 — rascador de aceite (abajo) -->
  <rect id="aro3" x="288" y="240" width="14" height="10" rx="2" fill="#BA7517"/>
  <rect id="aro3r" x="526" y="240" width="14" height="10" rx="2" fill="#BA7517"/>
  <text x="548" y="249" font-size="10" fill="#BA7517">aro rascador de aceite</text>

  <!-- Línea separadora entre zonas -->
  <line id="sep-line" x1="270" y1="200" x2="530" y2="200" stroke="var(--color-border-secondary)" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text id="sep-text" x="400" y="197" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">barrera — los aros no dejan pasar nada</text>

  <!-- BIELA -->
  <line x1="400" y1="275" x2="400" y2="340" stroke="var(--color-text-secondary)" stroke-width="6" stroke-linecap="round" opacity="0.3"/>

  <!-- FALLA: aceite que sube (oculto por defecto) -->
  <g id="falla-aceite" opacity="0">
    <!-- humo/aceite subiendo -->
    <path d="M 310 240 Q 315 210 310 180 Q 305 160 315 140" fill="none" stroke="#BA7517" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
    <path d="M 490 240 Q 485 210 490 180 Q 495 160 485 140" fill="none" stroke="#BA7517" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
    <path d="M 360 240 Q 355 200 365 160 Q 370 140 360 120" fill="none" stroke="#BA7517" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
    <path d="M 440 240 Q 445 200 435 160 Q 430 140 440 120" fill="none" stroke="#BA7517" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
    <!-- zona combustión contaminada -->
    <rect x="288" y="40" width="224" height="120" rx="0" fill="#BA7517" opacity="0.15"/>
    <text x="400" y="108" text-anchor="middle" font-size="11" fill="#E24B4A">aceite contamina la mezcla</text>
  </g>

  <!-- Info falla -->
  <g id="falla-info" opacity="0">
    <rect x="20" y="310" width="190" height="90" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="115" y="332" text-anchor="middle" font-size="12" font-weight="500" fill="#E24B4A">Síntomas visibles:</text>
    <text x="115" y="352" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">· Humo azul del escape</text>
    <text x="115" y="368" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">· Consume aceite rápido</text>
    <text x="115" y="384" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">· Baja potencia</text>
  </g>

  <!-- Leyenda aros -->
  <rect x="230" y="368" width="12" height="12" rx="2" fill="#534AB7"/>
  <text x="248" y="379" font-size="11" fill="var(--color-text-secondary)">aros de compresión (sellan la explosión)</text>
  <rect x="230" y="386" width="12" height="12" rx="2" fill="#BA7517"/>
  <text x="248" y="397" font-size="11" fill="var(--color-text-secondary)">aro rascador (raspa aceite de la pared)</text>
</svg>
</div>

<script>
(function(){
  function setBtn(id) {
    ['normal','falla'].forEach(function(k){
      var b = document.getElementById('tab-'+k);
      if(k===id){
        b.style.background='var(--color-background-info)'; b.style.color='var(--color-text-info)';
        b.style.borderColor='var(--color-border-info)'; b.style.fontWeight='500';
      } else {
        b.style.background='var(--color-background-secondary)'; b.style.color='var(--color-text-secondary)';
        b.style.borderColor='var(--color-border-secondary)'; b.style.fontWeight='400';
      }
    });
  }
  function op(id,val){ var e=document.getElementById(id); if(e) e.setAttribute('opacity',val); }

  window.showAro = function(tab) {
    setBtn(tab);
    if(tab==='normal'){
      document.getElementById('inf-title').textContent='Motor sano';
      document.getElementById('inf-1').textContent='El pistón tiene 3 aros';
      document.getElementById('inf-2').textContent='de metal que sellan';
      document.getElementById('inf-3').textContent='contra la pared del';
      document.getElementById('inf-4').textContent='cilindro.';
      document.getElementById('inf-5').textContent='Arriba: zona de combustión';
      document.getElementById('inf-5').setAttribute('fill','#1D9E75');
      document.getElementById('inf-6').textContent='(nafta + aire + chispa)';
      document.getElementById('inf-6').setAttribute('fill','#1D9E75');
      document.getElementById('inf-7').textContent='Abajo: zona de aceite';
      document.getElementById('inf-7').setAttribute('fill','#BA7517');
      document.getElementById('inf-8').textContent='(lubrica las paredes)';
      document.getElementById('inf-8').setAttribute('fill','#BA7517');
      document.getElementById('inf-9').textContent='Los aros separan';
      document.getElementById('inf-10').textContent='ambas zonas.';
      op('falla-aceite',0); op('falla-info',0);
      op('aro1',1); op('aro1r',1); op('aro2',1); op('aro2r',1); op('aro3',1); op('aro3r',1);
    } else {
      document.getElementById('inf-title').textContent='Aros gastados';
      document.getElementById('inf-1').textContent='Cuando los aros se';
      document.getElementById('inf-2').textContent='desgastan dejan de';
      document.getElementById('inf-3').textContent='sellar bien.';
      document.getElementById('inf-4').textContent='';
      document.getElementById('inf-5').textContent='El aceite sube a la';
      document.getElementById('inf-5').setAttribute('fill','#E24B4A');
      document.getElementById('inf-6').textContent='zona de combustión';
      document.getElementById('inf-6').setAttribute('fill','#E24B4A');
      document.getElementById('inf-7').textContent='y se quema junto';
      document.getElementById('inf-7').setAttribute('fill','#E24B4A');
      document.getElementById('inf-8').textContent='con la nafta.';
      document.getElementById('inf-8').setAttribute('fill','#E24B4A');
      document.getElementById('inf-9').textContent='Esto es lo que se';
      document.getElementById('inf-10').textContent='rectifica en el taller.';
      op('falla-aceite',1); op('falla-info',1);
      op('aro1',0.3); op('aro1r',0.3); op('aro2',0.3); op('aro2r',0.3); op('aro3',0.3); op('aro3r',0.3);
    }
  };
  window.showAro('normal');
})();
</script>
