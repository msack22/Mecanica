
<div style="padding:8px 0">
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap" id="bloq-btns"></div>

<svg id="bloq-svg" width="100%" viewBox="0 0 680 420">
  <defs>
    <marker id="abq2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INFO BOX -->
  <rect x="20" y="30" width="185" height="340" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text id="bi-title" x="112" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-text-primary)">El problema</text>
  <text id="bi-1" x="112" y="84"  text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-2" x="112" y="102" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-3" x="112" y="120" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-4" x="112" y="138" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-5" x="112" y="166" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-6" x="112" y="184" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-7" x="112" y="202" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-8" x="112" y="220" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-9" x="112" y="248" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-10" x="112" y="266" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-11" x="112" y="284" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-12" x="112" y="302" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)"></text>
  <text id="bi-tip" x="112" y="330" text-anchor="middle" font-size="11" fill="#BA7517"></text>
  <text id="bi-tip2" x="112" y="346" text-anchor="middle" font-size="11" fill="#BA7517"></text>

  <!-- CONTENIDO PRINCIPAL -->
  <!-- Pestaña 1: problema -->
  <g id="tab1-content">
    <!-- Polea levas OK -->
    <circle cx="310" cy="110" r="36" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="310" y="107" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">árbol levas</text>
    <text x="310" y="120" text-anchor="middle" font-size="9" fill="#1D9E75">alineado</text>
    <polygon points="310,74 303,86 317,86" fill="#1D9E75" opacity="0.9"/>
    <rect x="306" y="62" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>

    <!-- Flecha se mueve -->
    <path d="M 335 80 Q 360 90 350 115" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#abq2)" opacity="0.9"/>
    <text x="368" y="88" font-size="10" fill="#E24B4A">se mueve</text>
    <text x="368" y="102" font-size="10" fill="#E24B4A">sola →</text>

    <!-- Polea levas desalineada -->
    <circle cx="490" cy="110" r="36" fill="var(--color-background-secondary)" stroke="#E24B4A" stroke-width="1.5"/>
    <text x="490" y="107" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">árbol levas</text>
    <text x="490" y="120" text-anchor="middle" font-size="9" fill="#E24B4A">desalineada</text>
    <polygon points="512,94 518,107 504,107" fill="#E24B4A" opacity="0.9"/>
    <rect x="486" y="62" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>

    <!-- Sin correa indicador -->
    <rect x="384" y="148" width="32" height="110" rx="0" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
    <text x="400" y="210" text-anchor="middle" font-size="9" fill="#E24B4A">sin</text>
    <text x="400" y="222" text-anchor="middle" font-size="9" fill="#E24B4A">correa</text>

    <!-- Cigüeñal -->
    <circle cx="400" cy="320" r="44" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="400" y="317" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">cigüeñal</text>
    <text x="400" y="333" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">más pesado — menos riesgo</text>
    <polygon points="400,276 393,288 407,288" fill="#1D9E75" opacity="0.9"/>
    <rect x="396" y="264" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>

    <!-- Explicación resortes -->
    <rect x="230" y="160" width="150" height="90" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="305" y="182" text-anchor="middle" font-size="11" font-weight="500" fill="#E24B4A">¿Por qué se mueve?</text>
    <text x="305" y="200" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">Los resortes de las</text>
    <text x="305" y="216" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">válvulas están siempre</text>
    <text x="305" y="232" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">comprimidos y empujan.</text>
  </g>

  <!-- Pestaña 2: solución -->
  <g id="tab2-content" opacity="0">
    <!-- Polea bloqueada -->
    <circle cx="320" cy="120" r="36" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="2"/>
    <text x="320" y="117" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">árbol levas</text>
    <text x="320" y="130" text-anchor="middle" font-size="9" fill="#1D9E75">BLOQUEADO</text>
    <polygon points="320,84 313,96 327,96" fill="#1D9E75" opacity="0.9"/>
    <rect x="316" y="72" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>

    <!-- Perno de bloqueo -->
    <rect x="336" y="108" width="55" height="14" rx="4" fill="#534AB7" opacity="0.85"/>
    <rect x="391" y="113" width="35" height="6" rx="2" fill="#534AB7" opacity="0.6"/>
    <text x="445" y="108" font-size="11" font-weight="500" fill="#534AB7">Perno de bloqueo</text>
    <text x="445" y="124" font-size="10" fill="var(--color-text-secondary)">entra en agujero de</text>
    <text x="445" y="138" font-size="10" fill="var(--color-text-secondary)">la polea y la fija</text>

    <!-- Truco corrector -->
    <rect x="230" y="178" width="390" height="80" rx="8" fill="var(--color-background-secondary)" stroke="#BA7517" stroke-width="1"/>
    <text x="425" y="200" text-anchor="middle" font-size="12" font-weight="500" fill="#BA7517">Truco del mecánico (sin herramienta):</text>
    <text x="425" y="220" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Con la correa puesta, marcás una línea de corrector blanco</text>
    <text x="425" y="238" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">que cruza la polea y la tapa del motor.</text>

    <!-- Visual corrector -->
    <circle cx="320" cy="320" r="36" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="320" y="322" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">polea</text>
    <!-- Línea corrector cruzando polea y tapa -->
    <line x1="306" y1="284" x2="334" y2="284" stroke="white" stroke-width="3"/>
    <line x1="306" y1="284" x2="288" y2="270" stroke="white" stroke-width="3"/>
    <text x="320" y="275" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">línea corrector</text>
    <rect x="280" y="256" width="80" height="14" rx="3" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" opacity="0.8"/>
    <text x="320" y="267" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">tapa del motor</text>

    <rect x="380" y="280" width="270" height="80" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="515" y="302" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Si la polea se mueve</text>
    <text x="515" y="320" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">la línea queda partida en dos</text>
    <text x="515" y="338" text-anchor="middle" font-size="11" fill="#E24B4A">y lo ves inmediatamente.</text>
  </g>

  <!-- Pestaña 3: orden -->
  <g id="tab3-content" opacity="0">
    <rect x="230" y="28" width="420" height="44" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="33" width="24" height="24" rx="5" fill="#534AB7" opacity="0.85"/>
    <text x="246" y="49" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">1</text>
    <text x="270" y="47" font-size="12" fill="var(--color-text-primary)">Girás el motor hasta alinear marcas (PMR)</text>
    <text x="270" y="61" font-size="10" fill="var(--color-text-secondary)">con la correa vieja todavía puesta</text>

    <rect x="230" y="84" width="420" height="44" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="89" width="24" height="24" rx="5" fill="#534AB7" opacity="0.85"/>
    <text x="246" y="105" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">2</text>
    <text x="270" y="103" font-size="12" fill="var(--color-text-primary)">Marcás con corrector blanco</text>
    <text x="270" y="117" font-size="10" fill="#BA7517">línea que cruza polea + tapa en cigüeñal Y árbol levas</text>

    <rect x="230" y="140" width="420" height="44" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="145" width="24" height="24" rx="5" fill="#534AB7" opacity="0.85"/>
    <text x="246" y="161" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">3</text>
    <text x="270" y="159" font-size="12" fill="var(--color-text-primary)">Aflojás tensador y sacás la correa vieja</text>
    <text x="270" y="173" font-size="10" fill="var(--color-text-secondary)">sin tocar las poleas</text>

    <rect x="230" y="196" width="420" height="44" rx="8" fill="var(--color-background-secondary)" stroke="#E24B4A" stroke-width="1.5"/>
    <rect x="234" y="201" width="24" height="24" rx="5" fill="#E24B4A" opacity="0.9"/>
    <text x="246" y="217" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">!</text>
    <text x="270" y="215" font-size="12" fill="#E24B4A">Verificás que las marcas NO se movieron</text>
    <text x="270" y="229" font-size="10" fill="var(--color-text-secondary)">si se movieron → realineás antes de seguir</text>

    <rect x="230" y="252" width="420" height="44" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="257" width="24" height="24" rx="5" fill="#534AB7" opacity="0.85"/>
    <text x="246" y="273" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">4</text>
    <text x="270" y="271" font-size="12" fill="var(--color-text-primary)">Ponés la correa nueva con marcas alineadas</text>
    <text x="270" y="285" font-size="10" fill="var(--color-text-secondary)">tensás con el tensador</text>

    <rect x="230" y="308" width="420" height="44" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="313" width="24" height="24" rx="5" fill="#534AB7" opacity="0.85"/>
    <text x="246" y="329" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">5</text>
    <text x="270" y="327" font-size="12" fill="var(--color-text-primary)">Girás 2 vueltas a mano y verificás marcas</text>
    <text x="270" y="341" font-size="10" fill="var(--color-text-secondary)">si coinciden → podés arrancar el motor</text>

    <rect x="230" y="364" width="420" height="38" rx="8" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1"/>
    <text x="440" y="387" text-anchor="middle" font-size="11" fill="#1D9E75">✓ Nunca arrancar el motor sin hacer el paso 5 — es la red de seguridad final</text>
  </g>
</svg>
</div>

<script>
(function(){
  var tabs = [
    { id: 'problema', label: 'El problema' },
    { id: 'solucion', label: 'La solución' },
    { id: 'orden',    label: 'Orden correcto' }
  ];

  var contents = {
    problema: {
      show: 'tab1-content',
      title: 'El problema',
      lines: [
        ['Al sacar la correa,','var(--color-text-secondary)'],
        ['el árbol de levas queda','var(--color-text-secondary)'],
        ['libre para girar.','var(--color-text-secondary)'],
        ['','var(--color-text-secondary)'],
        ['Los resortes de válvulas','#E24B4A'],
        ['lo pueden mover solos','#E24B4A'],
        ['sin que te des cuenta.','#E24B4A'],
        ['','var(--color-text-secondary)'],
        ['Si se mueve aunque','var(--color-text-secondary)'],
        ['sea un diente, perdés','var(--color-text-secondary)'],
        ['la sincronización.','var(--color-text-secondary)'],
        ['','var(--color-text-secondary)'],
      ],
      tip: '⚠ El cigüeñal es más', tip2: 'pesado y se mueve menos.'
    },
    solucion: {
      show: 'tab2-content',
      title: 'La solución',
      lines: [
        ['Dos opciones:','var(--color-text-secondary)'],
        ['','var(--color-text-secondary)'],
        ['1. Perno de bloqueo:','#534AB7'],
        ['herramienta especial','#534AB7'],
        ['que fija la polea.','#534AB7'],
        ['','var(--color-text-secondary)'],
        ['2. Truco corrector:','#BA7517'],
        ['marcás antes de sacar','#BA7517'],
        ['y verificás después.','#BA7517'],
        ['','var(--color-text-secondary)'],
        ['Para el Gol AP el','var(--color-text-secondary)'],
        ['corrector alcanza.','var(--color-text-secondary)'],
      ],
      tip: '', tip2: ''
    },
    orden: {
      show: 'tab3-content',
      title: 'Orden completo',
      lines: [
        ['Seguí los 5 pasos en','var(--color-text-secondary)'],
        ['orden estricto.','var(--color-text-secondary)'],
        ['','var(--color-text-secondary)'],
        ['El paso ! en rojo es','#E24B4A'],
        ['donde detectás si algo','#E24B4A'],
        ['se movió.','#E24B4A'],
        ['','var(--color-text-secondary)'],
        ['El paso 5 es la red','#1D9E75'],
        ['de seguridad final.','#1D9E75'],
        ['','var(--color-text-secondary)'],
        ['Nunca arrancar sin','var(--color-text-secondary)'],
        ['verificar las 2 vueltas.','var(--color-text-secondary)'],
      ],
      tip: '', tip2: ''
    }
  };

  var btnRow = document.getElementById('bloq-btns');
  var currentTab = 'problema';

  tabs.forEach(function(t) {
    var b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.id = t.id;
    b.style.cssText = 'cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);';
    b.addEventListener('click', function() { render(t.id); });
    btnRow.appendChild(b);
  });

  function op(id, val) { var e = document.getElementById(id); if(e) e.setAttribute('opacity', val); }

  function render(tabId) {
    currentTab = tabId;
    var c = contents[tabId];

    // botones
    btnRow.querySelectorAll('button').forEach(function(b) {
      if(b.dataset.id === tabId) {
        b.style.background = 'var(--color-background-info)';
        b.style.color = 'var(--color-text-info)';
        b.style.borderColor = 'var(--color-border-info)';
        b.style.fontWeight = '500';
      } else {
        b.style.background = 'var(--color-background-secondary)';
        b.style.color = 'var(--color-text-secondary)';
        b.style.borderColor = 'var(--color-border-secondary)';
        b.style.fontWeight = '400';
      }
    });

    // contenidos
    ['tab1-content','tab2-content','tab3-content'].forEach(function(id) { op(id, 0); });
    op(c.show, 1);

    // info box
    document.getElementById('bi-title').textContent = c.title;
    for(var i = 0; i < 12; i++) {
      var el = document.getElementById('bi-'+(i+1));
      if(el && c.lines[i]) {
        el.textContent = c.lines[i][0];
        el.setAttribute('fill', c.lines[i][1]);
      }
    }
    document.getElementById('bi-tip').textContent = c.tip;
    document.getElementById('bi-tip2').textContent = c.tip2;
  }

  render('problema');
})();
</script>
