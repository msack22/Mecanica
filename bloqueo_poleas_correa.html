
<div style="padding:8px 0">
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
  <button onclick="showBloq('problema')" id="b-problema" style="cursor:pointer;padding:6px 14px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info);font-weight:500">El problema</button>
  <button onclick="showBloq('solucion')" id="b-solucion" style="cursor:pointer;padding:6px 14px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">La solución</button>
  <button onclick="showBloq('orden')" id="b-orden" style="cursor:pointer;padding:6px 14px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Orden correcto</button>
</div>

<svg width="100%" viewBox="0 0 680 420">
  <defs>
    <marker id="abq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INFO BOX -->
  <rect x="20" y="30" width="185" height="330" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text id="bq-title" x="112" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-text-primary)">El problema</text>
  <text id="bq-1" x="112" y="82"  text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Al sacar la correa,</text>
  <text id="bq-2" x="112" y="100" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">el árbol de levas y el</text>
  <text id="bq-3" x="112" y="118" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">cigüeñal quedan libres</text>
  <text id="bq-4" x="112" y="136" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">para girar.</text>
  <text id="bq-5" x="112" y="164" text-anchor="middle" font-size="12" fill="#E24B4A">El árbol de levas es</text>
  <text id="bq-6" x="112" y="182" text-anchor="middle" font-size="12" fill="#E24B4A">especialmente sensible</text>
  <text id="bq-7" x="112" y="200" text-anchor="middle" font-size="12" fill="#E24B4A">— los resortes de las</text>
  <text id="bq-8" x="112" y="218" text-anchor="middle" font-size="12" fill="#E24B4A">válvulas lo pueden</text>
  <text id="bq-9" x="112" y="236" text-anchor="middle" font-size="12" fill="#E24B4A">mover solos.</text>
  <text id="bq-10" x="112" y="264" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Si se mueve aunque</text>
  <text id="bq-11" x="112" y="282" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">sea un poco, perdés</text>
  <text id="bq-12" x="112" y="300" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">la referencia exacta.</text>
  <text id="bq-tip" x="112" y="332" text-anchor="middle" font-size="11" fill="#BA7517"></text>
  <text id="bq-tip2" x="112" y="348" text-anchor="middle" font-size="11" fill="#BA7517"></text>

  <!-- ===== PROBLEMA ===== -->
  <g id="grp-prob">
    <!-- Polea árbol levas con marca alineada -->
    <circle cx="340" cy="110" r="36" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="340" y="107" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">árbol</text>
    <text x="340" y="120" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">levas</text>
    <!-- marca OK -->
    <polygon id="marca-ok" points="340,74 333,86 347,86" fill="#1D9E75" opacity="0.9"/>
    <rect x="336" y="62" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>
    <text x="395" y="74" font-size="10" fill="#1D9E75">✓ alineada</text>

    <!-- Flecha rotación involuntaria -->
    <path id="flecha-mov" d="M 365 80 Q 385 95 375 115" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#abq)" opacity="0.8"/>
    <text x="390" y="98" font-size="10" fill="#E24B4A">se mueve</text>
    <text x="390" y="112" font-size="10" fill="#E24B4A">sola →</text>

    <!-- Polea árbol levas desalineada -->
    <circle cx="530" cy="110" r="36" fill="var(--color-background-secondary)" stroke="#E24B4A" stroke-width="1.5"/>
    <text x="530" y="107" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">árbol</text>
    <text x="530" y="120" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">levas</text>
    <!-- marca desviada -->
    <polygon points="552,90 558,103 544,103" fill="#E24B4A" opacity="0.9"/>
    <rect x="526" y="62" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>
    <text x="490" y="74" text-anchor="end" font-size="10" fill="#E24B4A">✗ desalineada</text>

    <!-- Cigüeñal (abajo) - se puede mover también -->
    <circle cx="340" cy="320" r="44" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="340" y="317" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">cigüeñal</text>
    <text x="340" y="333" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">más pesado,</text>
    <text x="340" y="347" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">menos riesgo</text>
    <!-- marca cigüeñal -->
    <polygon points="340,276 333,288 347,288" fill="#1D9E75" opacity="0.9"/>
    <rect x="336" y="264" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>

    <!-- Sin correa -->
    <text x="420" y="220" text-anchor="middle" font-size="13" fill="#E24B4A" opacity="0.6">sin</text>
    <text x="420" y="238" text-anchor="middle" font-size="13" fill="#E24B4A" opacity="0.6">correa</text>
    <rect x="400" y="148" width="40" height="120" rx="0" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="6 4" opacity="0.3"/>

    <!-- Resortes válvula empujan -->
    <rect x="460" y="200" width="175" height="90" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="547" y="224" text-anchor="middle" font-size="11" font-weight="500" fill="#E24B4A">¿Por qué se mueve el árbol?</text>
    <text x="547" y="244" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Los resortes de las válvulas</text>
    <text x="547" y="262" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">están comprimidos y generan</text>
    <text x="547" y="280" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">fuerza sobre las levas.</text>
  </g>

  <!-- ===== SOLUCIÓN ===== -->
  <g id="grp-sol" opacity="0">
    <!-- Polea árbol levas bloqueada -->
    <circle cx="300" cy="120" r="36" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="300" y="117" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">árbol levas</text>
    <text x="300" y="130" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">BLOQUEADO</text>
    <polygon points="300,84 293,96 307,96" fill="#1D9E75" opacity="0.9"/>
    <rect x="296" y="72" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>

    <!-- Herramienta de bloqueo árbol levas -->
    <rect x="316" y="100" width="60" height="16" rx="4" fill="#534AB7" opacity="0.8"/>
    <rect x="376" y="106" width="40" height="6" rx="2" fill="#534AB7" opacity="0.6"/>
    <text x="430" y="100" font-size="11" font-weight="500" fill="#534AB7">Perno de bloqueo</text>
    <text x="430" y="116" font-size="10" fill="var(--color-text-secondary)">entra en un agujero de</text>
    <text x="430" y="130" font-size="10" fill="var(--color-text-secondary)">la polea y la fija</text>

    <!-- Alternativa destornillador -->
    <rect x="230" y="175" width="380" height="70" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="420" y="198" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-primary)">Alternativa sin herramienta especial:</text>
    <text x="420" y="218" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Marcás con corrector blanco la posición exacta</text>
    <text x="420" y="234" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">de la marca en la tapa ANTES de sacar la correa.</text>

    <!-- Cigüeñal -->
    <circle cx="300" cy="330" r="40" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="300" y="327" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">cigüeñal</text>
    <text x="300" y="341" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">más seguro</text>
    <polygon points="300,290 293,302 307,302" fill="#1D9E75" opacity="0.9"/>
    <rect x="296" y="278" width="8" height="12" rx="2" fill="var(--color-text-secondary)" opacity="0.5"/>

    <!-- Truco corrector -->
    <rect x="380" y="265" width="270" height="130" rx="10" fill="var(--color-background-secondary)" stroke="#BA7517" stroke-width="1"/>
    <text x="515" y="290" text-anchor="middle" font-size="12" font-weight="500" fill="#BA7517">Truco del mecánico:</text>
    <text x="515" y="312" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Con la correa todavía puesta,</text>
    <text x="515" y="330" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">pintás una línea blanca que</text>
    <text x="515" y="348" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">cruza la polea y la tapa.</text>
    <text x="515" y="366" text-anchor="middle" font-size="11" fill="#BA7517">Si se mueve, lo ves fácil.</text>
  </g>

  <!-- ===== ORDEN CORRECTO ===== -->
  <g id="grp-orden" opacity="0">
    <rect x="230" y="30" width="420" height="48" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="36" width="26" height="26" rx="6" fill="#534AB7" opacity="0.8"/>
    <text x="247" y="53" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">1</text>
    <text x="274" y="50" font-size="12" fill="var(--color-text-primary)">Girás hasta alinear marcas (PMR cil. 1)</text>
    <text x="274" y="66" font-size="11" fill="var(--color-text-secondary)">con la correa vieja todavía puesta</text>

    <rect x="230" y="92" width="420" height="48" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="98" width="26" height="26" rx="6" fill="#534AB7" opacity="0.8"/>
    <text x="247" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">2</text>
    <text x="274" y="112" font-size="12" fill="var(--color-text-primary)">Marcás con corrector blanco</text>
    <text x="274" y="128" font-size="11" fill="#BA7517">línea que cruza polea + tapa en cada eje</text>

    <rect x="230" y="154" width="420" height="48" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="160" width="26" height="26" rx="6" fill="#534AB7" opacity="0.8"/>
    <text x="247" y="177" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">3</text>
    <text x="274" y="174" font-size="12" fill="var(--color-text-primary)">Aflojás el tensador y sacás la correa</text>
    <text x="274" y="190" font-size="11" fill="var(--color-text-secondary)">con cuidado de no tocar las poleas</text>

    <rect x="230" y="216" width="420" height="48" rx="8" fill="var(--color-background-secondary)" stroke="#E24B4A" stroke-width="1"/>
    <rect x="234" y="222" width="26" height="26" rx="6" fill="#E24B4A" opacity="0.8"/>
    <text x="247" y="239" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">!</text>
    <text x="274" y="236" font-size="12" fill="#E24B4A">Verificás que las marcas NO se movieron</text>
    <text x="274" y="252" font-size="11" fill="var(--color-text-secondary)">si se movieron → volvé a alinear antes de seguir</text>

    <rect x="230" y="278" width="420" height="48" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <rect x="234" y="284" width="26" height="26" rx="6" fill="#534AB7" opacity="0.8"/>
    <text x="247" y="301" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">4</text>
    <text x="274" y="298" font-size="12" fill="var(--color-text-primary)">Ponés la correa nueva con las marcas</text>
    <text x="274" y="314" font-size="11" fill="var(--color-text-secondary)">alineadas, tensás y verificás 2 vueltas a mano</text>

    <rect x="230" y="340" width="420" height="48" rx="8" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1"/>
    <rect x="234" y="346" width="26" height="26" rx="6" fill="#1D9E75" opacity="0.8"/>
    <text x="247" y="363" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">✓</text>
    <text x="274" y="360" font-size="12" fill="#1D9E75">Arrancás el motor y escuchás</text>
    <text x="274" y="376" font-size="11" fill="var(--color-text-secondary)">si suena normal → todo bien</text>
  </g>
</svg>
</div>

<script>
(function(){
  function setBtn(id) {
    ['problema','solucion','orden'].forEach(function(k){
      var b = document.getElementById('b-'+k);
      if(!b) return;
      if(k===id){
        b.style.background='var(--color-background-info)'; b.style.color='var(--color-text-info)';
        b.style.borderColor='var(--color-border-info)'; b.style.fontWeight='500';
      } else {
        b.style.background='var(--color-background-secondary)'; b.style.color='var(--color-text-secondary)';
        b.style.borderColor='var(--color-border-secondary)'; b.style.fontWeight='400';
      }
    });
  }
  function op(id,val){ var e=document.getElementById(id); if(e) e.setAttribute('opacity',val); }
  function txt(id,val){ var e=document.getElementById(id); if(e) e.textContent=val; }

  window.showBloq = function(tab) {
    setBtn(tab);
    ['grp-prob','grp-sol','grp-orden'].forEach(function(id){ op(id,0); });

    if(tab==='problema'){
      op('grp-prob',1);
      txt('bq-title','El problema');
      txt('bq-1','Al sacar la correa,'); txt('bq-2','el árbol de levas y el');
      txt('bq-3','cigüeñal quedan libres'); txt('bq-4','para girar.');
      txt('bq-5','El árbol de levas es'); txt('bq-6','especialmente sensible');
      txt('bq-7','— los resortes de las'); txt('bq-8','válvulas lo pueden');
      txt('bq-9','mover solos.');
      txt('bq-10','Si se mueve aunque'); txt('bq-11','sea un poco, perdés');
      txt('bq-12','la referencia exacta.');
      txt('bq-tip',''); txt('bq-tip2','');
      document.getElementById('bq-5').setAttribute('fill','#E24B4A');
      document.getElementById('bq-6').setAttribute('fill','#E24B4A');
      document.getElementById('bq-7').setAttribute('fill','#E24B4A');
      document.getElementById('bq-8').setAttribute('fill','#E24B4A');
      document.getElementById('bq-9').setAttribute('fill','#E24B4A');

    } else if(tab==='solucion'){
      op('grp-sol',1);
      txt('bq-title','La solución');
      txt('bq-1','Dos opciones:'); txt('bq-2','');
      txt('bq-3','1. Herramienta especial'); txt('bq-4','de bloqueo de polea');
      txt('bq-5','(perno que entra en'); txt('bq-6','un agujero de la polea');
      txt('bq-7','y la fija en posición).');
      txt('bq-8','2. Truco del corrector:'); txt('bq-9','marcás antes de sacar');
      txt('bq-10','y verificás que no se'); txt('bq-11','movió después.');
      txt('bq-12','');
      txt('bq-tip','Para el Gol AP el'); txt('bq-tip2','truco del corrector alcanza.');
      document.getElementById('bq-5').setAttribute('fill','#534AB7');
      document.getElementById('bq-6').setAttribute('fill','#534AB7');
      document.getElementById('bq-7').setAttribute('fill','#534AB7');
      document.getElementById('bq-8').setAttribute('fill','#BA7517');
      document.getElementById('bq-9').setAttribute('fill','#BA7517');
      document.getElementById('bq-10').setAttribute('fill','var(--color-text-secondary)');
      document.getElementById('bq-11').setAttribute('fill','var(--color-text-secondary)');
      document.getElementById('bq-tip').setAttribute('fill','#BA7517');
      document.getElementById('bq-tip2').setAttribute('fill','#BA7517');

    } else {
      op('grp-orden',1);
      txt('bq-title','Orden completo');
      txt('bq-1','Este orden evita el'); txt('bq-2','problema de raíz —');
      txt('bq-3','siempre marcás antes'); txt('bq-4','de soltar cualquier cosa.');
      txt('bq-5','Si algo se mueve lo'); txt('bq-6','detectás en el paso !");
      txt('bq-7','antes de poner la correa'); txt('bq-8','nueva.');
      txt('bq-9',''); txt('bq-10','El paso más importante');
      txt('bq-11','es el de verificar 2'); txt('bq-12','vueltas a mano al final.');
      txt('bq-tip','Nunca saltear ese paso,'); txt('bq-tip2','por más seguro que te sientas.');
      document.getElementById('bq-5').setAttribute('fill','#1D9E75');
      document.getElementById('bq-6').setAttribute('fill','#1D9E75');
      document.getElementById('bq-7').setAttribute('fill','#1D9E75');
      document.getElementById('bq-8').setAttribute('fill','#1D9E75');
      document.getElementById('bq-10').setAttribute('fill','var(--color-text-secondary)');
      document.getElementById('bq-11').setAttribute('fill','var(--color-text-secondary)');
      document.getElementById('bq-12').setAttribute('fill','var(--color-text-secondary)');
      document.getElementById('bq-tip').setAttribute('fill','#BA7517');
      document.getElementById('bq-tip2').setAttribute('fill','#BA7517');
    }
  };
  window.showBloq('problema');
})();
</script>
