
<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: transparent; }
  .container { display: flex; height: 480px; }
  .sidebar { width: 200px; min-width: 200px; background: var(--color-background-secondary); border-right: 1px solid var(--color-border-secondary); overflow-y: auto; }
  .sidebar-item { padding: 10px 14px; cursor: pointer; border-left: 3px solid transparent; font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 8px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .sidebar-item:hover { background: var(--color-background-tertiary); }
  .sidebar-item.active { border-left-color: var(--color-text-info); background: var(--color-background-info); color: var(--color-text-info); font-weight: 500; }
  .sidebar-item .icon { font-size: 16px; }
  .content { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .content h2 { font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 4px; }
  .content .subtitle { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 14px; }
  .section { margin-bottom: 14px; }
  .section-title { font-size: 11px; font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .item { font-size: 12px; color: var(--color-text-secondary); padding: 5px 10px; background: var(--color-background-secondary); border-radius: 6px; margin-bottom: 4px; border-left: 2px solid transparent; line-height: 1.5; }
  .item.verde { border-left-color: #1D9E75; }
  .item.azul { border-left-color: #185FA5; }
  .item.naranja { border-left-color: #BA7517; }
  .item.rojo { border-left-color: #E24B4A; }
  .item.violeta { border-left-color: #534AB7; }
  .item.gris { border-left-color: #888780; }
  .test { font-size: 11px; color: var(--color-text-secondary); padding: 6px 10px; background: var(--color-background-secondary); border-radius: 6px; margin-bottom: 4px; }
  .test strong { color: #1D9E75; }
  .warn { color: #E24B4A; font-weight: 500; }
  .tip { color: #BA7517; }
</style>
</head>
<body>
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar"></div>

<!-- CONTENT -->
<div class="content" id="content">
  <h2>Panel de repaso</h2>
  <p class="subtitle">Seleccioná un tema del menú</p>
</div>

</div>

var sidebar = document.getElementById('sidebar');
var content = document.getElementById('content');

temas.forEach(function(t, i) {
  var item = document.createElement('div');
  item.className = 'sidebar-item';
  item.innerHTML = '<span class="icon">' + t.icon + '</span><span>' + t.label + '</span>';
  item.addEventListener('click', function() {
    sidebar.querySelectorAll('.sidebar-item').forEach(function(el) { el.classList.remove('active'); });
    item.classList.add('active');

    var html = '<h2>' + t.icon + ' ' + t.h2 + '</h2><p class="subtitle">' + t.sub + '</p>';
    t.secciones.forEach(function(s) {
      html += '<div class="section"><div class="section-title">' + s.title + '</div>';
      s.items.forEach(function(it) {
        html += '<div class="item ' + it.c + '">' + it.t + '</div>';
      });
      html += '</div>';
    });
    content.innerHTML = html;
  });
  sidebar.appendChild(item);
});

// activar primero
sidebar.querySelectorAll('.sidebar-item')[0].click();

</body>
</html>
