
<div style="padding:8px 0">
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
  <button id="btn-mono" onclick="show('mono')" style="cursor:pointer;padding:6px 20px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info);font-weight:500">Mono-inyector</button>
  <button id="btn-multi" onclick="show('multi')" style="cursor:pointer;padding:6px 20px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">4 inyectores</button>
</div>

<!-- MONO -->
<svg id="svg-mono" width="100%" viewBox="0 0 680 420">
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Info box -->
  <rect x="20" y="30" width="200" height="180" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text x="120" y="58" text-anchor="middle" font-size="15" font-weight="500" fill="var(--color-text-primary)">Mono-inyector</text>
  <text x="120" y="82" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Un solo punto mezcla</text>
  <text x="120" y="98" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">aire + nafta. Los 4</text>
  <text x="120" y="114" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">cilindros comparten</text>
  <text x="120" y="130" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">esa mezcla.</text>
  <text x="120" y="158" text-anchor="middle" font-size="12" fill="#BA7517">Años: ~1980–1995</text>
  <text x="120" y="176" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Gol con carburador</text>
  <text x="120" y="194" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">o TBI (inyec. central)</text>

  <!-- Inyector central -->
  <rect x="295" y="30" width="90" height="36" rx="8" fill="#BA7517" opacity="0.85"/>
  <text x="340" y="52" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Inyector único</text>

  <!-- Colector de admisión -->
  <rect x="255" y="90" width="170" height="28" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="340" y="108" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">colector de admisión</text>

  <!-- Flecha inyector → colector -->
  <line x1="340" y1="66" x2="340" y2="90" stroke="#BA7517" stroke-width="1.5" marker-end="url(#am)"/>

  <!-- 4 ramas del colector -->
  <line x1="280" y1="118" x2="220" y2="155" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.4"/>
  <line x1="310" y1="118" x2="300" y2="155" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.4"/>
  <line x1="370" y1="118" x2="380" y2="155" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="118" x2="460" y2="155" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.4"/>

  <!-- 4 cilindros -->
  <rect x="190" y="155" width="60" height="80" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <rect x="270" y="155" width="60" height="80" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <rect x="350" y="155" width="60" height="80" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <rect x="430" y="155" width="60" height="80" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>

  <text x="220" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Cil. 1</text>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Cil. 2</text>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Cil. 3</text>
  <text x="460" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Cil. 4</text>

  <!-- Pistones -->
  <rect x="196" y="215" width="48" height="10" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
  <rect x="276" y="215" width="48" height="10" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
  <rect x="356" y="215" width="48" height="10" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
  <rect x="436" y="215" width="48" height="10" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>

  <!-- Mezcla igual en todos -->
  <rect x="196" y="160" width="48" height="54" rx="0" fill="#9FE1CB" opacity="0.3"/>
  <rect x="276" y="160" width="48" height="54" rx="0" fill="#9FE1CB" opacity="0.3"/>
  <rect x="356" y="160" width="48" height="54" rx="0" fill="#9FE1CB" opacity="0.3"/>
  <rect x="436" y="160" width="48" height="54" rx="0" fill="#9FE1CB" opacity="0.3"/>

  <!-- Nota mezcla igual -->
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Todos reciben la misma mezcla — sin control individual</text>

  <!-- Desventaja -->
  <rect x="200" y="320" width="280" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text x="340" y="342" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Más simple y barato de mantener.</text>
  <text x="340" y="360" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Menos eficiente que el multipunto.</text>
</svg>

<!-- MULTI -->
<svg id="svg-multi" width="100%" viewBox="0 0 680 420" style="display:none">
  <defs>
    <marker id="am2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Info box -->
  <rect x="20" y="30" width="200" height="180" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text x="120" y="58" text-anchor="middle" font-size="15" font-weight="500" fill="var(--color-text-primary)">4 inyectores</text>
  <text x="120" y="82" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Cada cilindro tiene</text>
  <text x="120" y="98" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">su propio inyector.</text>
  <text x="120" y="114" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">La computadora</text>
  <text x="120" y="130" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">controla cada uno</text>
  <text x="120" y="146" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">por separado.</text>
  <text x="120" y="174" text-anchor="middle" font-size="12" fill="#1D9E75">Años: ~1995 en adelante</text>
  <text x="120" y="192" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Gol con ECU (cerebro)</text>

  <!-- Computadora / ECU -->
  <rect x="285" y="30" width="110" height="36" rx="8" fill="#534AB7" opacity="0.85"/>
  <text x="340" y="52" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ECU (computadora)</text>

  <!-- Colector solo aire -->
  <rect x="255" y="95" width="170" height="26" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <text x="340" y="112" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">colector — solo aire</text>

  <!-- Flecha ECU → colector (señal eléctrica) -->
  <line x1="340" y1="66" x2="340" y2="95" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#am2)"/>

  <!-- 4 ramas -->
  <line x1="280" y1="121" x2="220" y2="155" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.35"/>
  <line x1="310" y1="121" x2="300" y2="155" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.35"/>
  <line x1="370" y1="121" x2="380" y2="155" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.35"/>
  <line x1="400" y1="121" x2="460" y2="155" stroke="var(--color-text-secondary)" stroke-width="1" opacity="0.35"/>

  <!-- Inyectores individuales encima de cada cilindro -->
  <rect x="200" y="138" width="40" height="18" rx="4" fill="#BA7517" opacity="0.85"/>
  <rect x="280" y="138" width="40" height="18" rx="4" fill="#BA7517" opacity="0.85"/>
  <rect x="360" y="138" width="40" height="18" rx="4" fill="#BA7517" opacity="0.85"/>
  <rect x="440" y="138" width="40" height="18" rx="4" fill="#BA7517" opacity="0.85"/>
  <text x="220" y="151" text-anchor="middle" font-size="10" fill="#fff">iny.</text>
  <text x="300" y="151" text-anchor="middle" font-size="10" fill="#fff">iny.</text>
  <text x="380" y="151" text-anchor="middle" font-size="10" fill="#fff">iny.</text>
  <text x="460" y="151" text-anchor="middle" font-size="10" fill="#fff">iny.</text>

  <!-- Líneas ECU → inyectores -->
  <line x1="285" y1="48" x2="220" y2="138" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="310" y1="48" x2="300" y2="138" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="370" y1="48" x2="380" y2="138" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="395" y1="48" x2="460" y2="138" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 4 cilindros -->
  <rect x="190" y="155" width="60" height="80" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <rect x="270" y="155" width="60" height="80" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <rect x="350" y="155" width="60" height="80" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
  <rect x="430" y="155" width="60" height="80" rx="6" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>

  <text x="220" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Cil. 1</text>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Cil. 2</text>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Cil. 3</text>
  <text x="460" y="200" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">Cil. 4</text>

  <!-- Pistones -->
  <rect x="196" y="215" width="48" height="10" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
  <rect x="276" y="215" width="48" height="10" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
  <rect x="356" y="215" width="48" height="10" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>
  <rect x="436" y="215" width="48" height="10" rx="3" fill="var(--color-text-secondary)" opacity="0.5"/>

  <!-- Mezcla en todos -->
  <rect x="196" y="160" width="48" height="54" rx="0" fill="#9FE1CB" opacity="0.3"/>
  <rect x="276" y="160" width="48" height="54" rx="0" fill="#9FE1CB" opacity="0.3"/>
  <rect x="356" y="160" width="48" height="54" rx="0" fill="#9FE1CB" opacity="0.3"/>
  <rect x="436" y="160" width="48" height="54" rx="0" fill="#9FE1CB" opacity="0.3"/>

  <text x="340" y="300" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Cada inyector recibe una señal eléctrica de la ECU</text>

  <rect x="200" y="320" width="280" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text x="340" y="342" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Más eficiente y limpio.</text>
  <text x="340" y="360" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Necesita una computadora (ECU).</text>
</svg>
</div>

<script>
(function(){
  function show(mode) {
    var mono = document.getElementById('svg-mono');
    var multi = document.getElementById('svg-multi');
    var bm = document.getElementById('btn-mono');
    var bmu = document.getElementById('btn-multi');
    if (mode === 'mono') {
      mono.style.display = 'block';
      multi.style.display = 'none';
      bm.style.background = 'var(--color-background-info)';
      bm.style.color = 'var(--color-text-info)';
      bm.style.borderColor = 'var(--color-border-info)';
      bm.style.fontWeight = '500';
      bmu.style.background = 'var(--color-background-secondary)';
      bmu.style.color = 'var(--color-text-secondary)';
      bmu.style.borderColor = 'var(--color-border-secondary)';
      bmu.style.fontWeight = '400';
    } else {
      mono.style.display = 'none';
      multi.style.display = 'block';
      bmu.style.background = 'var(--color-background-info)';
      bmu.style.color = 'var(--color-text-info)';
      bmu.style.borderColor = 'var(--color-border-info)';
      bmu.style.fontWeight = '500';
      bm.style.background = 'var(--color-background-secondary)';
      bm.style.color = 'var(--color-text-secondary)';
      bm.style.borderColor = 'var(--color-border-secondary)';
      bm.style.fontWeight = '400';
    }
  }
  window.show = show;
})();
</script>
