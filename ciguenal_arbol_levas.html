
<div style="padding:8px 0">
<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
  <button onclick="showLev('ciguenal')" id="l-ciguenal" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-info);background:var(--color-background-info);color:var(--color-text-info);font-weight:500">Cigüeñal</button>
  <button onclick="showLev('levas')" id="l-levas" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Árbol de levas</button>
  <button onclick="showLev('juntos')" id="l-juntos" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Cómo trabajan juntos</button>
  <button onclick="showLev('correa')" id="l-correa" style="cursor:pointer;padding:6px 16px;font-size:13px;border-radius:6px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary)">Correa de distribución</button>
</div>

<svg width="100%" viewBox="0 0 680 430">
  <defs>
    <marker id="alv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- INFO BOX -->
  <rect x="20" y="30" width="190" height="310" rx="10" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
  <text id="lv-title" x="115" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-text-primary)">El cigüeñal</text>
  <text id="lv-1" x="115" y="82"  text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Convierte el movimiento</text>
  <text id="lv-2" x="115" y="100" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">de arriba/abajo del</text>
  <text id="lv-3" x="115" y="118" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">pistón en rotación.</text>
  <text id="lv-4" x="115" y="136" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Como una biela de</text>
  <text id="lv-5" x="115" y="154" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">tren a vapor.</text>
  <text id="lv-6" x="115" y="182" text-anchor="middle" font-size="12" fill="#1D9E75">Al final del cigüeñal</text>
  <text id="lv-7" x="115" y="200" text-anchor="middle" font-size="12" fill="#1D9E75">va el volante motor</text>
  <text id="lv-8" x="115" y="218" text-anchor="middle" font-size="12" fill="#1D9E75">→ embrague → caja.</text>
  <text id="lv-9" x="115" y="246" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Al otro extremo va</text>
  <text id="lv-10" x="115" y="264" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">la polea que mueve</text>
  <text id="lv-11" x="115" y="282" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">la correa de distribución</text>
  <text id="lv-12" x="115" y="300" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">y el alternador.</text>
  <text id="lv-tip" x="115" y="326" text-anchor="middle" font-size="11" fill="#BA7517"></text>
  <text id="lv-tip2" x="115" y="342" text-anchor="middle" font-size="11" fill="#BA7517"></text>

  <!-- ===== CIGUEÑAL ===== -->
  <g id="grp-ciguenal">
    <!-- Eje principal -->
    <rect x="240" y="230" width="360" height="20" rx="6" fill="var(--color-text-secondary)" opacity="0.35"/>
    <text x="420" y="264" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">cigüeñal (eje principal)</text>

    <!-- 4 muñequillas (donde van las bielas) -->
    <rect x="268" y="200" width="18" height="30" rx="4" fill="#534AB7" opacity="0.7"/>
    <rect x="328" y="215" width="18" height="30" rx="4" fill="#534AB7" opacity="0.7"/>
    <rect x="388" y="200" width="18" height="30" rx="4" fill="#534AB7" opacity="0.7"/>
    <rect x="448" y="215" width="18" height="30" rx="4" fill="#534AB7" opacity="0.7"/>

    <!-- 4 bielas -->
    <line x1="277" y1="200" x2="277" y2="155" stroke="#534AB7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="337" y1="215" x2="337" y2="140" stroke="#534AB7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="397" y1="200" x2="397" y2="155" stroke="#534AB7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="457" y1="215" x2="457" y2="140" stroke="#534AB7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- 4 pistones -->

    <rect x="318" y="113" width="38" height="28" rx="4" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <rect x="378" y="128" width="38" height="28" rx="4" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <rect x="438" y="113" width="38" height="28" rx="4" fill="var(--color-background-secondary)" stroke="#534AB7" stroke-width="1"/>
    <text x="277" y="146" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">P1</text>
    <text x="337" y="131" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">P2</text>
    <text x="397" y="146" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">P3</text>
    <text x="457" y="131" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">P4</text>

    <!-- Extremo izq: polea correa -->
    <circle cx="245" cy="240" r="18" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="245" y="237" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">polea</text>
    <text x="245" y="248" text-anchor="middle" font-size="8" fill="var(--color-text-secondary)">dist.</text>

    <!-- Extremo der: volante + embrague -->
    <circle cx="615" cy="240" r="22" fill="var(--color-background-secondary)" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="615" y="237" text-anchor="middle" font-size="8" fill="#1D9E75">volante</text>
    <text x="615" y="249" text-anchor="middle" font-size="8" fill="#1D9E75">motor</text>
    <text x="615" y="276" text-anchor="middle" font-size="9" fill="#1D9E75">→ embrague</text>

    <!-- Labels muñequillas -->
    <text x="277" y="295" text-anchor="middle" font-size="9" fill="#534AB7">muñequilla</text>
    <text x="277" y="306" text-anchor="middle" font-size="9" fill="#534AB7">(biela va acá)</text>

    <!-- Flecha rotación -->
    <path d="M 220 225 Q 200 240 220 255" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#alv)" opacity="0.6"/>
    <text x="192" y="242" text-anchor="middle" font-size="9" fill="#1D9E75">gira</text>
  </g>

  <!-- ===== ÁRBOL DE LEVAS ===== -->
  <g id="grp-levas" opacity="0">
    <!-- Eje árbol de levas -->
    <rect x="240" y="60" width="360" height="14" rx="6" fill="var(--color-text-secondary)" opacity="0.3"/>
    <text x="420" y="50" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">árbol de levas</text>

    <!-- Levas (chichones) — 8 levas para 8 válvulas -->
    <!-- leva 1 adm -->
    <ellipse cx="272" cy="60" rx="8" ry="18" fill="#BA7517" opacity="0.8"/>
    <ellipse cx="296" cy="60" rx="8" ry="14" fill="#888780" opacity="0.6"/>
    <!-- leva 2 -->
    <ellipse cx="332" cy="60" rx="8" ry="18" fill="#BA7517" opacity="0.8"/>
    <ellipse cx="356" cy="60" rx="8" ry="14" fill="#888780" opacity="0.6"/>
    <!-- leva 3 -->
    <ellipse cx="392" cy="60" rx="8" ry="18" fill="#BA7517" opacity="0.8"/>
    <ellipse cx="416" cy="60" rx="8" ry="14" fill="#888780" opacity="0.6"/>
    <!-- leva 4 -->
    <ellipse cx="452" cy="60" rx="8" ry="18" fill="#BA7517" opacity="0.8"/>
    <ellipse cx="476" cy="60" rx="8" ry="14" fill="#888780" opacity="0.6"/>

    <!-- Válvulas que empujan -->
    <!-- ADM -->
    <line x1="272" y1="78" x2="272" y2="115" stroke="#BA7517" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="332" y1="78" x2="332" y2="115" stroke="#BA7517" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="392" y1="78" x2="392" y2="115" stroke="#BA7517" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="452" y1="78" x2="452" y2="115" stroke="#BA7517" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- ESC -->
    <line x1="296" y1="74" x2="296" y2="115" stroke="#888780" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="356" y1="74" x2="356" y2="115" stroke="#888780" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="416" y1="74" x2="416" y2="115" stroke="#888780" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="476" y1="74" x2="476" y2="115" stroke="#888780" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Tapa cilindros -->
    <rect x="248" y="115" width="260" height="20" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5" opacity="0.8"/>
    <text x="378" y="130" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">tapa de cilindros (culata)</text>

    <!-- Leyenda levas -->
    <rect x="248" y="340" width="14" height="14" rx="3" fill="#BA7517" opacity="0.8"/>
    <text x="268" y="352" font-size="11" fill="var(--color-text-secondary)">leva de admisión — abre válvula de entrada</text>
    <rect x="248" y="362" width="14" height="14" rx="3" fill="#888780" opacity="0.6"/>
    <text x="268" y="374" font-size="11" fill="var(--color-text-secondary)">leva de escape — abre válvula de salida</text>

    <!-- 8V vs 16V nota -->
    <rect x="248" y="160" width="260" height="60" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="378" y="182" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">8v = 1 árbol · 8 levas</text>
    <text x="378" y="200" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">16v = 2 árboles · 16 levas</text>
    <text x="378" y="214" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">uno para admisión, otro para escape</text>
  </g>

  <!-- ===== JUNTOS ===== -->
  <g id="grp-juntos" opacity="0">
    <!-- Árbol levas arriba -->
    <rect x="240" y="55" width="360" height="12" rx="5" fill="var(--color-text-secondary)" opacity="0.25"/>
    <ellipse cx="280" cy="55" rx="7" ry="15" fill="#BA7517" opacity="0.7"/>
    <ellipse cx="340" cy="55" rx="7" ry="15" fill="#BA7517" opacity="0.7"/>
    <ellipse cx="400" cy="55" rx="7" ry="15" fill="#BA7517" opacity="0.7"/>
    <ellipse cx="460" cy="55" rx="7" ry="15" fill="#BA7517" opacity="0.7"/>
    <text x="420" y="42" text-anchor="middle" font-size="10" fill="#BA7517">árbol de levas (arriba)</text>

    <!-- Cigüeñal abajo -->
    <rect x="240" y="250" width="360" height="16" rx="6" fill="var(--color-text-secondary)" opacity="0.3"/>
    <text x="420" y="285" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">cigüeñal (abajo)</text>

    <!-- Pistones en medio -->
    <rect x="262" y="130" width="36" height="80" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <rect x="322" y="110" width="36" height="100" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <rect x="382" y="130" width="36" height="80" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <rect x="442" y="110" width="36" height="100" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
    <text x="280" y="178" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">P1</text>
    <text x="340" y="168" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">P2</text>
    <text x="400" y="178" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">P3</text>
    <text x="460" y="168" text-anchor="middle" font-size="9" fill="var(--color-text-secondary)">P4</text>

    <!-- Válvulas entre levas y pistones -->
    <line x1="280" y1="70" x2="280" y2="130" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="340" y1="70" x2="340" y2="110" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="400" y1="70" x2="400" y2="130" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="460" y1="70" x2="460" y2="110" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Bielas -->
    <line x1="280" y1="210" x2="280" y2="250" stroke="#534AB7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="340" y1="210" x2="340" y2="250" stroke="#534AB7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="400" y1="210" x2="400" y2="250" stroke="#534AB7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="460" y1="210" x2="460" y2="250" stroke="#534AB7" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- Correa uniendo levas y cigüeñal -->
    <rect x="228" y="50" width="14" height="220" rx="4" fill="none" stroke="#1D9E75" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <text x="216" y="165" text-anchor="middle" font-size="9" fill="#1D9E75" transform="rotate(-90,216,165)">correa distribución</text>

    <!-- Regla de sincronización -->
    <rect x="248" y="310" width="360" height="50" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="428" y="332" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">La regla clave de sincronización:</text>
    <text x="428" y="350" text-anchor="middle" font-size="11" fill="var(--color-text-secondary)">el árbol de levas gira a la MITAD de velocidad del cigüeñal</text>
  </g>

  <!-- ===== CORREA ===== -->
  <g id="grp-correa" opacity="0">
    <!-- Polea cigüeñal (grande) -->
    <circle cx="290" cy="320" r="40" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1.5"/>
    <text x="290" y="317" text-anchor="middle" font-size="11" font-weight="500" fill="var(--color-text-primary)">Polea</text>
    <text x="290" y="333" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">cigüeñal</text>
    <text x="290" y="374" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">grande (2x)</text>

    <!-- Polea árbol levas (chica) -->
    <circle cx="290" cy="120" r="24" fill="var(--color-background-secondary)" stroke="#BA7517" stroke-width="1.5"/>
    <text x="290" y="117" text-anchor="middle" font-size="10" font-weight="500" fill="#BA7517">Polea</text>
    <text x="290" y="131" text-anchor="middle" font-size="10" fill="#BA7517">árbol levas</text>
    <text x="290" y="84" text-anchor="middle" font-size="10" fill="#BA7517">chica (1x)</text>

    <!-- Correa -->
    <rect x="272" y="144" width="36" height="176" rx="0" fill="none" stroke="#534AB7" stroke-width="8" opacity="0.4"/>
    <text x="326" y="238" font-size="11" font-weight="500" fill="#534AB7">Correa de</text>
    <text x="326" y="254" font-size="11" font-weight="500" fill="#534AB7">distribución</text>
    <text x="326" y="276" font-size="10" fill="var(--color-text-secondary)">(dentada — no puede</text>
    <text x="326" y="290" font-size="10" fill="var(--color-text-secondary)">saltar dientes)</text>

    <!-- Flecha rotación -->
    <path d="M 246 310 Q 228 320 246 330" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#alv)" opacity="0.7"/>
    <path d="M 268 128 Q 252 120 268 112" fill="none" stroke="#BA7517" stroke-width="2" marker-end="url(#alv)" opacity="0.7"/>

    <!-- Warning correa -->
    <rect x="430" y="80" width="210" height="130" rx="10" fill="var(--color-background-secondary)" stroke="#E24B4A" stroke-width="1"/>
    <text x="535" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#E24B4A">⚠ La correa más</text>
    <text x="535" y="124" text-anchor="middle" font-size="13" font-weight="500" fill="#E24B4A">importante del auto</text>
    <text x="535" y="150" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">Si se rompe, el árbol</text>
    <text x="535" y="168" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">de levas se detiene</text>
    <text x="535" y="186" text-anchor="middle" font-size="12" fill="var(--color-text-secondary)">y las válvulas chocan</text>
    <text x="535" y="204" text-anchor="middle" font-size="12" fill="#E24B4A">con los pistones → motor fundido</text>

    <!-- Kilometraje cambio -->
    <rect x="430" y="230" width="210" height="60" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
    <text x="535" y="254" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-text-primary)">Cambio en el Gol AP:</text>
    <text x="535" y="272" text-anchor="middle" font-size="12" fill="#BA7517">cada 60.000 km</text>
  </g>
</svg>
</div>

<script>
(function(){
  var infos = {
    ciguenal: {
      title: "El cigüeñal",
      l1:"Convierte el movimiento", l2:"de arriba/abajo del",
      l3:"pistón en rotación.", l4:"Como una biela de",
      l5:"tren a vapor.",
      l6:"Al final del cigüeñal", l7:"va el volante motor",
      l8:"→ embrague → caja.",
      l9:"Al otro extremo va", l10:"la polea que mueve",
      l11:"la correa de distribución", l12:"y el alternador.",
      tip:"", tip2:"",
      c6:"#1D9E75", c7:"#1D9E75", c8:"#1D9E75"
    },
    levas: {
      title: "Árbol de levas",
      l1:"Abre y cierra las", l2:"válvulas en el momento",
      l3:"exacto.", l4:"Cada 'chichón' (leva)",
      l5:"empuja una válvula.",
      l6:"8v = 1 árbol de levas", l7:"16v = 2 árboles",
      l8:"(uno adm, uno escape).",
      l9:"Gira a la mitad de", l10:"velocidad del cigüeñal —",
      l11:"2 vueltas del cigüeñal", l12:"= 1 del árbol de levas.",
      tip:"⚠ Está arriba del motor,", tip2:"dentro de la tapa de válvulas",
      c6:"#BA7517", c7:"#BA7517", c8:"#BA7517"
    },
    juntos: {
      title: "Juntos en el motor",
      l1:"El cigüeñal está ABAJO,", l2:"el árbol de levas ARRIBA.",
      l3:"Los pistones van en", l4:"el medio conectando",
      l5:"ambos.",
      l6:"Mientras el cigüeñal", l7:"gira abajo, el árbol",
      l8:"de levas coordina",
      l9:"exactamente cuándo", l10:"abrir cada válvula",
      l11:"para que todo ocurra", l12:"en el orden correcto.",
      tip:"", tip2:"",
      c6:"var(--color-text-secondary)", c7:"var(--color-text-secondary)", c8:"var(--color-text-secondary)"
    },
    correa: {
      title: "Correa de distribución",
      l1:"Une el cigüeñal con", l2:"el árbol de levas.",
      l3:"Es dentada para que", l4:"nunca pierda sincronía.",
      l5:"",
      l6:"Si se rompe en", l7:"movimiento las válvulas",
      l8:"chocan con los pistones.",
      l9:"Es la reparación más", l10:"importante del Gol —",
      l11:"si comprás uno viejo,", l12:"lo primero que revisás.",
      tip:"⚠ Cambio: cada 60.000 km", tip2:"No esperes que se rompa",
      c6:"#E24B4A", c7:"#E24B4A", c8:"#E24B4A"
    }
  };

  function setBtn(id) {
    ['ciguenal','levas','juntos','correa'].forEach(function(k){
      var b = document.getElementById('l-'+k);
      if(!b) return;
      if(k===id){
        b.style.background='var(--color-background-info)'; b.style.color='var(--color-text-info)';
        b.style.borderColor='var(--color-border-info)'; b.style.fontWeight='500';
      } else {
        b.style.background='var(--color-background-secondary)'; b.style.color='var(--color-text-secondary)';
        b.style.borderColor='var(--color-border-secondary)'; b.style.fontWeight='400';
      }
    });
  }

  function op(id,val){ var e=document.getElementById(id); if(e) e.setAttribute('opacity',val); }
  function txt(id,val){ var e=document.getElementById(id); if(e) e.textContent=val; }

  window.showLev = function(tab) {
    setBtn(tab);
